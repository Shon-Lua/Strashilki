name: Update RSS and Deploy

on:
  push:
    branches:
      - main

  schedule:
    - cron: '13,43 * * * *'

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download Podster RSS
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p DATA

          TEMP_FILE="$(mktemp "$RUNNER_TEMP/podster-rss.XXXXXX")"

          trap 'rm -f "$TEMP_FILE"' EXIT

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --compressed \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 4 \
            --connect-timeout 20 \
            --max-time 90 \
            --user-agent 'StrashilkiSiteRSS/1.0' \
            --header 'Accept: application/rss+xml, application/xml, text/xml;q=0.9, */*;q=0.8' \
            --output "$TEMP_FILE" \
            'https://podster.fm/rss.xml?pid=100576'

          python - "$TEMP_FILE" <<'PY'
          import re
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path(sys.argv[1])

          xml = path.read_text(encoding="utf-8-sig")

          xml = re.sub(
              r'<\?xml-stylesheet\b.*?\?>\s*',
              '',
              xml,
              count=1,
              flags=re.IGNORECASE | re.DOTALL
          )

          root = ET.fromstring(xml.encode("utf-8"))

          def local_name(tag):
              return tag.rsplit("}", 1)[-1].split(":")[-1].lower()

          if local_name(root.tag) not in ("rss", "rdf"):
              raise SystemExit("Unsupported RSS document")

          items = [
              node for node in root.iter()
              if local_name(node.tag) == "item"
          ]

          playable = 0

          for item in items:
              children = list(item)

              has_title = any(
                  local_name(child.tag) == "title"
                  and (child.text or "").strip()
                  for child in children
              )

              has_audio = False

              for child in children:
                  name = local_name(child.tag)

                  if name == "enclosure" and child.get("url"):
                      has_audio = True

                  elif name == "content" and (
                      child.get("url") or child.get("href")
                  ):
                      has_audio = True

                  elif name == "link" and (
                      (child.get("rel") or "").lower() == "enclosure"
                  ) and (
                      child.get("href") or (child.text or "").strip()
                  ):
                      has_audio = True

              if has_title and has_audio:
                  playable += 1

          if not items:
              raise SystemExit("RSS contains no episodes")

          if not playable:
              raise SystemExit("RSS contains no playable episodes")

          path.write_text(xml, encoding="utf-8")

          print(f"RSS validated: {playable} playable episodes")
          PY

          mv "$TEMP_FILE" DATA/podcast-feed.xml

          echo "RSS successfully downloaded"

      - name: Commit RSS Snapshot
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add DATA/podcast-feed.xml

          if git diff --cached --quiet; then
            echo "RSS has not changed"
          else
            git commit -m "Update Podster RSS [skip ci]"
            git push origin HEAD:main
          fi

      - name: Verify RSS File
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s DATA/podcast-feed.xml ]; then
            echo "::error::RSS file is missing"
            exit 1
          fi

          if grep -Eiq '<\?xml-stylesheet' DATA/podcast-feed.xml; then
            echo "::error::XML stylesheet was not removed"
            exit 1
          fi

          echo "RSS file verified"

          ls -lh DATA/podcast-feed.xml

          sha256sum DATA/podcast-feed.xml

      - name: Prepare Website
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s index.html ]; then
            echo "::error::index.html is missing"
            exit 1
          fi

          rm -rf _site
          mkdir -p _site

          shopt -s dotglob nullglob

          for item in *; do
            case "$item" in
              .git|.github|_site)
                continue
                ;;
            esac

            cp -a "$item" _site/
          done

          touch _site/.nojekyll

          if [ ! -s _site/index.html ]; then
            echo "::error::Website index.html is missing"
            exit 1
          fi

          if [ ! -s _site/DATA/podcast-feed.xml ]; then
            echo "::error::RSS is missing from deployment directory"
            exit 1
          fi

          cmp DATA/podcast-feed.xml _site/DATA/podcast-feed.xml

          echo "Website deployment directory verified"

          ls -lh _site/DATA/podcast-feed.xml

          sha256sum _site/DATA/podcast-feed.xml

      - name: Upload Website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify Published RSS
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail

          CHECK_FILE="$RUNNER_TEMP/published-rss.xml"

          RSS_URL="${PAGE_URL%/}/DATA/podcast-feed.xml?verify=${GITHUB_RUN_ID}"

          for attempt in $(seq 1 12); do
            STATUS="$(
              curl \
                --location \
                --silent \
                --show-error \
                --output "$CHECK_FILE" \
                --write-out '%{http_code}' \
                "$RSS_URL" || true
            )"

            if [ "$STATUS" = "200" ] && [ -s "$CHECK_FILE" ]; then

              if python - "$CHECK_FILE" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          try:
              root = ET.parse(sys.argv[1]).getroot()

              name = root.tag.rsplit("}", 1)[-1].lower()

              items = [
                  node for node in root.iter()
                  if node.tag.rsplit("}", 1)[-1].lower() == "item"
              ]

              if name not in ("rss", "rdf") or not items:
                  raise ValueError("Invalid published RSS")

              print(f"Published RSS verified: {len(items)} episodes")

          except Exception as error:
              print(error, file=sys.stderr)
              sys.exit(1)
          PY
              then
                echo "Published RSS is accessible"
                exit 0
              fi
            fi

            echo "RSS verification attempt $attempt failed: HTTP $STATUS"

            sleep 5
          done

          echo "::error::Published RSS is unavailable: $RSS_URL"
          exit 1
