name: Update RSS and Deploy

on:
  push:
    branches:
      - main

  schedule:
    - cron: '13,43 * * * *'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download Podster RSS
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p DATA

          TEMP_FILE="$(mktemp DATA/.podcast-feed.XXXXXX.tmp)"

          trap 'rm -f "$TEMP_FILE"' EXIT

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --compressed \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 4 \
            --connect-timeout 20 \
            --max-time 90 \
            --user-agent 'StrashilkiSiteRSS/1.0' \
            --header 'Accept: application/rss+xml, application/xml, text/xml;q=0.9, */*;q=0.8' \
            --output "$TEMP_FILE" \
            'https://podster.fm/rss.xml?pid=100576'

          python - "$TEMP_FILE" <<'PY'
          import re
          import sys
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path(sys.argv[1])

          xml = path.read_text(encoding="utf-8-sig")

          xml = re.sub(
              r'<\?xml-stylesheet\b.*?\?>\s*',
              '',
              xml,
              count=1,
              flags=re.IGNORECASE | re.DOTALL
          )

          root = ET.fromstring(xml)

          def local_name(tag):
              return tag.rsplit("}", 1)[-1].split(":")[-1].lower()

          if local_name(root.tag) not in ("rss", "rdf", "feed"):
              raise SystemExit("Unsupported RSS document")

          items = [
              node for node in root.iter()
              if local_name(node.tag) == "item"
          ]

          playable = 0

          for item in items:
              children = list(item)

              has_title = any(
                  local_name(child.tag) == "title"
                  and (child.text or "").strip()
                  for child in children
              )

              has_audio = False

              for child in children:
                  name = local_name(child.tag)

                  if name == "enclosure" and child.get("url"):
                      has_audio = True

                  elif name == "content" and (
                      child.get("url") or child.get("href")
                  ):
                      has_audio = True

                  elif name == "link" and (
                      (child.get("rel") or "").lower() == "enclosure"
                  ) and (
                      child.get("href") or (child.text or "").strip()
                  ):
                      has_audio = True

              if has_title and has_audio:
                  playable += 1

          if not items:
              raise SystemExit("RSS contains no episodes")

          if not playable:
              raise SystemExit("RSS contains no playable episodes")

          path.write_text(xml, encoding="utf-8")

          print(f"RSS validated: {playable} playable episodes")
          print("XML stylesheet removed")
          PY

          if [ ! -s "$TEMP_FILE" ]; then
            echo "::error::RSS file is empty"
            exit 1
          fi

          mv "$TEMP_FILE" DATA/podcast-feed.xml

          echo "RSS successfully downloaded"

      - name: Verify RSS File
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s DATA/podcast-feed.xml ]; then
            echo "::error::RSS file is missing"
            exit 1
          fi

          if grep -Eiq '<\?xml-stylesheet' DATA/podcast-feed.xml; then
            echo "::error::XML stylesheet was not removed"
            exit 1
          fi

          echo "RSS file verified successfully"

          ls -lh DATA/podcast-feed.xml

          sha256sum DATA/podcast-feed.xml

      - name: Prepare Website
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s index.html ]; then
            echo "::error::index.html is missing"
            exit 1
          fi

          rm -rf _site

          mkdir -p _site

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            ./ _site/

          touch _site/.nojekyll

          if [ ! -s _site/index.html ]; then
            echo "::error::Website index.html is missing from deployment directory"
            exit 1
          fi

          if [ ! -s _site/DATA/podcast-feed.xml ]; then
            echo "::error::RSS file is missing from deployment directory"
            exit 1
          fi

          echo "Website deployment directory verified"

          find _site/DATA -maxdepth 1 -type f -printf '%f (%s bytes)\n'

          sha256sum _site/DATA/podcast-feed.xml

      - name: Upload Website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4
