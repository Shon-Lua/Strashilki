name: Update RSS and Deploy

on:
  push:
    branches:
      - main

  schedule:
    - cron: '13,43 * * * *'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download Podster RSS
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p DATA

          TEMP_FILE="$(mktemp "$RUNNER_TEMP/podster-rss.XXXXXX")"

          trap 'rm -f "$TEMP_FILE"' EXIT

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --compressed \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 4 \
            --connect-timeout 20 \
            --max-time 90 \
            --user-agent 'StrashilkiSiteRSS/1.0' \
            --header 'Accept: application/rss+xml, application/xml, text/xml;q=0.9, */*;q=0.8' \
            --output "$TEMP_FILE" \
            'https://podster.fm/rss.xml?pid=100576'
          python - "$TEMP_FILE" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          xml = path.read_text(encoding="utf-8-sig")

          xml = re.sub(
              r'<\?xml-stylesheet\b.*?\?>\s*',
              '',
              xml,
              count=1,
              flags=re.IGNORECASE | re.DOTALL
          )

          path.write_text(xml, encoding="utf-8")
          PY
          python - "$TEMP_FILE" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          def local_name(tag):
              return tag.rsplit("}", 1)[-1].split(":")[-1].lower()

          try:
              root = ET.parse(sys.argv[1]).getroot()

              root_name = local_name(root.tag)

              if root_name not in ("rss", "rdf"):
                  raise ValueError("Unsupported RSS document")

              items = [
                  node for node in root.iter()
                  if local_name(node.tag) == "item"
              ]

              playable = 0

              for item in items:
                  children = list(item)

                  title = any(
                      local_name(child.tag) == "title"
                      and (child.text or "").strip()
                      for child in children
                  )

                  audio = False

                  for child in children:
                      name = local_name(child.tag)

                      if name == "enclosure" and child.get("url"):
                          audio = True

                      elif name == "content" and (
                          child.get("url") or child.get("href")
                      ):
                          audio = True

                      elif name == "link" and (
                          (child.get("rel") or "").lower() == "enclosure"
                      ) and (
                          child.get("href") or (child.text or "").strip()
                      ):
                          audio = True

                  if title and audio:
                      playable += 1

              if not items:
                  raise ValueError("RSS contains no episodes")

              if not playable:
                  raise ValueError("RSS contains no playable episodes")

              print(f"RSS validated: {playable} playable episodes")

          except Exception as error:
              print(f"RSS validation failed: {error}", file=sys.stderr)
              sys.exit(1)
          PY

          mv "$TEMP_FILE" DATA/podcast-feed.xml

          echo "RSS successfully downloaded"

      - name: Verify RSS File
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s DATA/podcast-feed.xml ]; then
            echo "::error::RSS file does not exist or is empty"
            exit 1
          fi

          echo "RSS file verified successfully"

          stat -c '%n (%s bytes)' DATA/podcast-feed.xml

          sha256sum DATA/podcast-feed.xml

      - name: Upload Website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4
