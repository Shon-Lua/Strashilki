<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Страшилки</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#000;
    color:#b9b9c8;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

  canvas#bg{position:fixed;inset:0;z-index:0;display:block;background:#000}

  .grain{
    position:fixed;inset:-60%;z-index:2;pointer-events:none;opacity:.032;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
    animation:grainMove .9s steps(3) infinite;
  }
  @keyframes grainMove{
    0%{transform:translate(0,0)}
    33%{transform:translate(-3%,2%)}
    66%{transform:translate(2%,-3%)}
    100%{transform:translate(0,0)}
  }

  .vignette{
    position:fixed;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 40%, rgba(0,0,0,.5) 82%, rgba(0,0,0,.95) 100%);
  }

  header{
    position:fixed;top:0;left:0;right:0;z-index:5;
    text-align:center;padding:34px 20px 0;pointer-events:none;
  }
  header h1{
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(18px,3.6vw,34px);
    letter-spacing:.46em;
    text-indent:.46em;
    color:#ece8f3;
    font-weight:400;
    text-shadow:0 0 22px rgba(255,255,255,.18), 0 0 60px rgba(180,160,255,.12);
    animation:flicker 8s infinite;
  }
  header p{
    margin-top:14px;
    font-size:9.5px;letter-spacing:.4em;text-transform:uppercase;
    color:#4e4a5e;
  }
  @keyframes flicker{
    0%,100%{opacity:.94}
    41%{opacity:.94}
    42%{opacity:.3}
    44%{opacity:.9}
    46%{opacity:.42}
    48%{opacity:.96}
    67%{opacity:.82}
    69%{opacity:1}
  }

  #skyWrap{
    position:fixed;inset:0;z-index:4;overflow:hidden;
  }
  #sky{
    position:absolute;top:0;left:0;width:100%;height:100%;
    transition:transform .95s cubic-bezier(.7,0,.28,1);
    will-change:transform;
  }
  .page{
    position:absolute;left:0;width:100%;height:100vh;
  }

  .star{
    position:absolute;width:48px;height:48px;
    transform:translate(-50%,-50%);
    background:none;border:none;padding:0;
    cursor:pointer;display:grid;place-items:center;
    -webkit-tap-highlight-color:transparent;
  }

  .star-core{
    position:absolute;top:50%;left:50%;
    width:4px;height:4px;border-radius:50%;
    background:#fff;
    transform:translate(-50%,-50%);
    box-shadow:0 0 6px 1.5px rgba(255,255,255,.7), 0 0 22px 6px rgba(190,210,255,.22);
    animation:twinkle 3.4s ease-in-out infinite;
    animation-delay:var(--delay);
    transition:background .5s, box-shadow .5s;
  }

  .star-flare{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);
    animation:twinkle 3.4s ease-in-out infinite;
    animation-delay:var(--delay);
    transition:background .5s;
  }
  .star-flare.h{
    width:26px;height:1px;
    background:radial-gradient(ellipse at center, rgba(255,255,255,.85) 0%, rgba(255,255,255,0) 78%);
  }
  .star-flare.v{
    width:1px;height:26px;
    background:radial-gradient(ellipse at center, rgba(255,255,255,.85) 0%, rgba(255,255,255,0) 78%);
  }

  @keyframes twinkle{
    0%,100%{opacity:.42}
    50%{opacity:.92}
  }

  .star-label{
    position:absolute;top:calc(100% - 2px);left:50%;
    transform:translate(-50%,-6px);
    white-space:nowrap;
    font-size:10px;letter-spacing:.2em;text-transform:uppercase;
    color:#9a94ac;
    opacity:0;transition:.35s ease;pointer-events:none;
    text-shadow:0 0 12px #000, 0 0 4px #000;
  }
  .star:hover .star-label,
  .star.active .star-label{opacity:1;transform:translate(-50%,0)}
  .star.active .star-label{color:#fff}

  .star:hover .star-core{
    box-shadow:0 0 10px 2px rgba(255,255,255,.95), 0 0 34px 10px rgba(200,215,255,.4);
  }
  .star:hover .star-flare.h,
  .star:hover .star-flare.v{opacity:1 !important}

  .star.active .star-core{
    background:var(--c);
    box-shadow:0 0 12px 3px var(--c), 0 0 44px 12px var(--g);
    animation:twinkleFast 1.2s ease-in-out infinite;
  }
  .star.active .star-flare.h{
    background:radial-gradient(ellipse at center, var(--c) 0%, rgba(255,255,255,0) 80%);
  }
  .star.active .star-flare.v{
    background:radial-gradient(ellipse at center, var(--c) 0%, rgba(255,255,255,0) 80%);
  }
  .star.active::after{
    content:'';
    position:absolute;top:50%;left:50%;
    width:42px;height:42px;border-radius:50%;
    border:1px solid var(--g);
    transform:translate(-50%,-50%) scale(.6);
    animation:ringPulse 2.4s ease-out infinite;
    pointer-events:none;
  }
  @keyframes twinkleFast{
    0%,100%{opacity:.72}
    50%{opacity:1}
  }
  @keyframes ringPulse{
    0%{transform:translate(-50%,-50%) scale(.55);opacity:.85}
    100%{transform:translate(-50%,-50%) scale(1.9);opacity:0}
  }

  .pageNav{
    position:fixed;top:36px;right:28px;z-index:7;
    display:flex;gap:6px;align-items:baseline;
    font-size:11px;letter-spacing:.3em;
    color:rgba(255,255,255,.3);
    font-variant-numeric:tabular-nums;
    pointer-events:none;
  }
  .pageNav i{font-style:normal;opacity:.45}
  #pageCurrent{color:rgba(255,255,255,.85)}

  .hint{
    position:fixed;bottom:152px;left:50%;
    transform:translateX(-50%);
    z-index:6;
    font-size:10px;letter-spacing:.34em;text-transform:uppercase;
    color:rgba(255,255,255,.34);
    animation:hintPulse 2.6s ease-in-out infinite;
    pointer-events:none;
    transition:opacity .8s ease;
    white-space:nowrap;
  }
  @keyframes hintPulse{
    0%,100%{opacity:.3}
    50%{opacity:.72}
  }

  .player{
    position:fixed;left:50%;bottom:26px;z-index:6;
    transform:translateX(-50%);
    width:min(760px,calc(100% - 32px));
    padding:14px 18px 10px;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    background:rgba(6,6,9,.66);
    border:1px solid rgba(255,255,255,.08);
    border-radius:14px;
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    box-shadow:0 0 0 1px rgba(0,0,0,.5), 0 22px 70px rgba(0,0,0,.8), inset 0 0 46px rgba(120,110,180,.05);
  }

  #playBtn{
    flex:0 0 auto;
    width:46px;height:46px;border-radius:50%;
    border:1px solid rgba(255,255,255,.16);
    background:radial-gradient(circle at 35% 30%, rgba(60,60,90,.55), rgba(10,10,16,.95));
    color:#e2dff0;cursor:pointer;
    display:grid;place-items:center;
    transition:.3s ease;
  }
  #playBtn:hover{
    border-color:rgba(255,255,255,.45);
    box-shadow:0 0 24px rgba(180,170,255,.3);
    color:#fff;
  }
  #playBtn svg{width:19px;height:19px;fill:currentColor}

  .meta{flex:1 1 160px;min-width:0}
  .meta .now{
    font-size:13px;letter-spacing:.06em;color:#e6e3f0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .meta .sub{
    margin-top:4px;font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;
    color:#565269;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  #viz{flex:0 0 auto;width:220px;height:38px;display:block;opacity:.9}

  .time{
    flex:0 0 auto;font-size:10.5px;letter-spacing:.16em;color:#605b75;
    font-variant-numeric:tabular-nums;
  }
  .time i{font-style:normal;opacity:.4;margin:0 4px}

  .bar{
    flex:1 1 100%;height:2px;border-radius:2px;
    background:rgba(255,255,255,.08);overflow:hidden;margin-top:2px;
  }
  #barFill{
    height:100%;width:0%;
    background:linear-gradient(90deg,rgba(200,210,255,.6),rgba(255,255,255,.95));
    box-shadow:0 0 12px rgba(200,210,255,.7);
    transition:width .22s linear;
  }

  @media (max-width:640px){
    header{padding-top:24px}
    .pageNav{top:26px;right:20px;font-size:10px}
    #viz{display:none}
    .player{bottom:16px;gap:12px;padding:12px 14px 8px}
    .hint{bottom:138px;font-size:9px;letter-spacing:.28em}
    .star-label{font-size:9px;letter-spacing:.14em;top:calc(100% + 2px)}
    .star{width:54px;height:54px}
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="grain"></div>
<div class="vignette"></div>

<header>
  <h1>СТРАШИЛКИ</h1>
  <p>прокрутите небо · выберите звезду</p>
</header>

<div id="skyWrap">
  <div id="sky"></div>
</div>

<div class="pageNav">
  <span id="pageCurrent">1</span>
  <i>/</i>
  <span id="pageTotal">1</span>
</div>

<div class="hint" id="hint">прокрутите небо</div>

<div class="player" id="player">
  <button id="playBtn" aria-label="Воспроизвести"></button>
  <div class="meta">
    <div class="now" id="nowTitle">Тишина</div>
    <div class="sub" id="nowSub">выберите звезду</div>
  </div>
  <canvas id="viz"></canvas>
  <div class="time"><span id="cur">0:00</span><i>/</i><span id="dur">0:00</span></div>
  <div class="bar"><div id="barFill"></div></div>
</div>

<script>
function fmt(s){
  s = Math.max(0, Math.floor(s));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return m + ':' + (r < 10 ? '0' : '') + r;
}

const TITLES = [
  'Тот, кто стучит в стену',
  'Станция, которой нет на карте',
  'Колыбельная для утонувших',
  'Дом помнит своих гостей',
  'Последняя запись',
  'Голос из подвала',
  'Ночной поезд в никуда',
  'Шкаф с двойным дном',
  'Человек за окном',
  'Лес, который шепчет',
  'Зеркало с трещиной',
  'Гость на чердаке',
  'Сигнал с пустой частоты',
  'Кукла с закрытыми глазами',
  'Погреб, которого не было',
  'Сосед сверху',
  'Фотография без лица',
  'Тот, кто звонит в три',
  'Комната с обоями',
  'Дверь без ручки',
  'Птицы, что не поют',
  'Тень на потолке',
  'Запись №9',
  'Тот, кто ждёт в конце коридора'
];

const DURATIONS = [272,438,344,367,239,412,298,351,386,423,275,331,408,292,359,374,311,428,264,347,396,283,336,415];

const COLORS = [
  ['#ff3b52','255,59,82'],
  ['#5fc9ff','95,201,255'],
  ['#3bffb0','59,255,176'],
  ['#ffb347','255,179,71'],
  ['#b06bff','176,107,255'],
  ['#ff7ab8','255,122,184'],
  ['#8affd4','138,255,212'],
  ['#ffd84d','255,216,77']
];

const PROFILES = [
  { tones:[[55,-7,'sine',.34],[82.4,6,'sine',.16],[110,-4,'triangle',.08],[41.2,3,'sine',.3]], filter:420, noiseFreq:700, noiseGain:.05 },
  { tones:[[110,-9,'sine',.24],[164.8,7,'sine',.15],[220,-5,'triangle',.06],[73.4,4,'sine',.2]], filter:880, noiseFreq:2400, noiseGain:.045 },
  { tones:[[73.4,5,'sine',.28],[110,-6,'sine',.17],[146.8,9,'triangle',.08],[36.7,-3,'sine',.24]], filter:520, noiseFreq:420, noiseGain:.06 },
  { tones:[[65.4,-8,'sine',.3],[98,6,'sine',.15],[130.8,-4,'triangle',.07],[43.7,2,'sine',.26]], filter:640, noiseFreq:1100, noiseGain:.05 },
  { tones:[[49,-10,'sine',.35],[73.4,8,'sine',.16],[98,-3,'triangle',.09],[32.7,5,'sine',.22]], filter:350, noiseFreq:900, noiseGain:.055 }
];

const EPISODES = TITLES.map((title, i) => {
  const [color, rgb] = COLORS[i % COLORS.length];
  const prof = PROFILES[i % PROFILES.length];
  const dur = DURATIONS[i % DURATIONS.length];
  return {
    title,
    sub: `Эпизод ${String(i+1).padStart(2,'0')} · ${fmt(dur)}`,
    dur, color, rgb,
    tones: prof.tones,
    filter: prof.filter,
    noiseFreq: prof.noiseFreq,
    noiseGain: prof.noiseGain
  };
});

const POSITIONS = [
  [16, 22], [48, 18], [80, 26],
  [14, 50], [44, 54], [74, 50],
  [30, 78], [60, 80]
];

const dpr = Math.min(window.devicePixelRatio || 1, 2);

const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
const sky = document.getElementById('sky');
const viz = document.getElementById('viz');
const vctx = viz.getContext('2d');
const playBtn = document.getElementById('playBtn');
const nowTitle = document.getElementById('nowTitle');
const nowSub = document.getElementById('nowSub');
const curEl = document.getElementById('cur');
const durEl = document.getElementById('dur');
const barFill = document.getElementById('barFill');
const pageCurrentEl = document.getElementById('pageCurrent');
const pageTotalEl = document.getElementById('pageTotal');
const hint = document.getElementById('hint');

let W = 0, H = 0;

function resize(){
  W = canvas.width = Math.floor(innerWidth * dpr);
  H = canvas.height = Math.floor(innerHeight * dpr);
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
  sizeViz();
}

function sizeViz(){
  const r = viz.getBoundingClientRect();
  if (r.width && r.height) {
    viz.width = Math.floor(r.width * dpr);
    viz.height = Math.floor(r.height * dpr);
  }
}

const spheres = [];
for (let i = 0; i < 6; i++) {
  spheres.push({
    x: 0.1 + Math.random() * 0.8,
    y: 0.1 + Math.random() * 0.8,
    r: 0.3 + Math.random() * 0.28,
    a: 0.018 + Math.random() * 0.035,
    fx: 0.00007 + Math.random() * 0.0001,
    fy: 0.00007 + Math.random() * 0.0001,
    ph: Math.random() * Math.PI * 2
  });
}

const tinyStars = [];
const tinyCount = innerWidth < 700 ? 110 : 200;
for (let i = 0; i < tinyCount; i++) {
  tinyStars.push({
    x: Math.random(),
    y: Math.random(),
    r: (Math.random() * 0.9 + 0.25) * dpr,
    a: Math.random() * 0.4 + 0.08,
    sp: Math.random() * 0.002 + 0.0004,
    ph: Math.random() * Math.PI * 2
  });
}

function drawBg(t){
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';

  spheres.forEach(s => {
    const x = (s.x + Math.sin(t * s.fx + s.ph) * 0.06) * W;
    const y = (s.y + Math.cos(t * s.fy + s.ph) * 0.05) * H;
    const r = s.r * Math.max(W, H);
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(255,255,255,' + s.a + ')');
    g.addColorStop(0.55, 'rgba(255,255,255,' + (s.a * 0.35) + ')');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, 6.2832);
    ctx.fill();
  });

  tinyStars.forEach(s => {
    const tw = 0.4 + 0.6 * Math.abs(Math.sin(t * s.sp + s.ph));
    ctx.fillStyle = 'rgba(255,255,255,' + (s.a * tw).toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, 6.2832);
    ctx.fill();
  });

  ctx.globalCompositeOperation = 'source-over';
}

const PER_PAGE = POSITIONS.length;
const totalPages = Math.ceil(EPISODES.length / PER_PAGE);

for (let p = 0; p < totalPages; p++) {
  const page = document.createElement('div');
  page.className = 'page';
  page.style.top = (p * 100) + 'vh';
  const start = p * PER_PAGE;
  const end = Math.min(start + PER_PAGE, EPISODES.length);
  for (let i = start; i < end; i++) {
    const pos = POSITIONS[i - start];
    const ep = EPISODES[i];
    const star = document.createElement('button');
    star.className = 'star';
    star.dataset.index = i;
    star.style.left = pos[0] + '%';
    star.style.top = pos[1] + '%';
    star.style.setProperty('--delay', (Math.random() * 4).toFixed(2) + 's');
    star.style.setProperty('--c', ep.color);
    star.style.setProperty('--g', 'rgba(' + ep.rgb + ',.55)');
    star.innerHTML =
      '<span class="star-flare h"></span>' +
      '<span class="star-flare v"></span>' +
      '<span class="star-core"></span>' +
      '<span class="star-label">' + ep.title + '</span>';
    star.addEventListener('click', () => selectStar(i));
    page.appendChild(star);
  }
  sky.appendChild(page);
}

pageTotalEl.textContent = totalPages;

let audioCtx = null, master = null, analyser = null, dataArr = null;
let sceneBus = null, sceneNodes = [];
let timers = [];
let current = -1;
let playing = false;
let elapsed = 0;
let lastTick = 0;

function initAudio(){
  if (audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AC();
  master = audioCtx.createGain();
  master.gain.value = 0.55;
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 128;
  analyser.smoothingTimeConstant = 0.82;
  master.connect(analyser);
  analyser.connect(audioCtx.destination);
  dataArr = new Uint8Array(analyser.frequencyBinCount);
}

function makeNoise(dur){
  const len = Math.floor(audioCtx.sampleRate * dur);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}

function buildScene(ep){
  const t0 = audioCtx.currentTime;
  const bus = audioCtx.createGain();
  bus.gain.setValueAtTime(0.0001, t0);
  bus.gain.exponentialRampToValueAtTime(0.85, t0 + 2.4);
  bus.connect(master);
  sceneBus = bus;

  const nodes = [bus];

  const droneFilter = audioCtx.createBiquadFilter();
  droneFilter.type = 'lowpass';
  droneFilter.frequency.value = ep.filter;
  droneFilter.Q.value = 5;
  droneFilter.connect(bus);

  const lfo = audioCtx.createOscillator();
  lfo.frequency.value = 0.06 + Math.random() * 0.05;
  const lfoGain = audioCtx.createGain();
  lfoGain.gain.value = ep.filter * 0.55;
  lfo.connect(lfoGain);
  lfoGain.connect(droneFilter.frequency);
  lfo.start(t0);
  nodes.push(lfo, lfoGain, droneFilter);

  ep.tones.forEach(([f, det, type, g]) => {
    const o = audioCtx.createOscillator();
    o.type = type;
    o.frequency.value = f;
    o.detune.value = det;
    const gain = audioCtx.createGain();
    gain.gain.value = g;
    o.connect(gain);
    gain.connect(droneFilter);
    o.start(t0);
    nodes.push(o, gain);
  });

  const noise = audioCtx.createBufferSource();
  noise.buffer = makeNoise(3);
  noise.loop = true;
  const nf = audioCtx.createBiquadFilter();
  nf.type = 'bandpass';
  nf.frequency.value = ep.noiseFreq;
  nf.Q.value = 0.9;
  const ng = audioCtx.createGain();
  ng.gain.value = ep.noiseGain;
  noise.connect(nf);
  nf.connect(ng);
  ng.connect(bus);
  noise.start(t0);
  nodes.push(noise, nf, ng);

  const tl = audioCtx.createOscillator();
  tl.frequency.value = 0.11 + Math.random() * 0.08;
  const tlg = audioCtx.createGain();
  tlg.gain.value = ep.noiseGain * 0.75;
  tl.connect(tlg);
  tlg.connect(ng.gain);
  tl.start(t0);
  nodes.push(tl, tlg);

  sceneNodes = nodes;
}

function stopScene(){
  timers.forEach(clearTimeout);
  timers = [];
  const nodes = sceneNodes;
  sceneNodes = [];
  sceneBus = null;
  if (!audioCtx || !nodes.length) return;

  const t = audioCtx.currentTime;
  const bus = nodes[0];
  try {
    bus.gain.cancelScheduledValues(t);
    bus.gain.setValueAtTime(Math.max(bus.gain.value, 0.0001), t);
    bus.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
  } catch (e) {}

  setTimeout(() => {
    nodes.forEach(n => {
      try { if (n.stop) n.stop(); } catch (e) {}
      try { n.disconnect(); } catch (e) {}
    });
  }, 1300);
}

function triggerEvent(ep){
  if (!audioCtx || !sceneBus) return;
  const t = audioCtx.currentTime;
  const k = Math.random();

  if (k < 0.3) {
    const o = audioCtx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(95, t);
    o.frequency.exponentialRampToValueAtTime(26, t + 0.75);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.45, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.95);
    o.connect(g);
    g.connect(sceneBus);
    o.start(t);
    o.stop(t + 1);
  } else if (k < 0.6) {
    const src = audioCtx.createBufferSource();
    src.buffer = makeNoise(1);
    const f = audioCtx.createBiquadFilter();
    f.type = 'bandpass';
    f.Q.value = 9;
    f.frequency.setValueAtTime(900 + Math.random() * 1300, t);
    f.frequency.linearRampToValueAtTime(600 + Math.random() * 700, t + 0.9);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.2, t + 0.25);
    g.gain.linearRampToValueAtTime(0.0001, t + 0.95);
    const pan = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
    src.connect(f);
    f.connect(g);
    if (pan) {
      pan.pan.value = Math.random() * 2 - 1;
      g.connect(pan);
      pan.connect(sceneBus);
    } else {
      g.connect(sceneBus);
    }
    src.start(t);
    src.stop(t + 1);
  } else if (k < 0.8) {
    const o = audioCtx.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(150, t);
    o.frequency.linearRampToValueAtTime(65 + Math.random() * 45, t + 1.2);
    const f = audioCtx.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = 520;
    f.Q.value = 13;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.1, t + 0.3);
    g.gain.linearRampToValueAtTime(0.0001, t + 1.2);
    o.connect(f);
    f.connect(g);
    g.connect(sceneBus);
    o.start(t);
    o.stop(t + 1.3);
  } else {
    for (let i = 0; i < 3; i++) {
      const tt = t + i * 0.29 + Math.random() * 0.05;
      const o = audioCtx.createOscillator();
      o.type = 'square';
      o.frequency.setValueAtTime(180, tt);
      o.frequency.exponentialRampToValueAtTime(58, tt + 0.13);
      const f = audioCtx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = 850;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.0001, tt);
      g.gain.exponentialRampToValueAtTime(0.24, tt + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, tt + 0.19);
      o.connect(f);
      f.connect(g);
      g.connect(sceneBus);
      o.start(tt);
      o.stop(tt + 0.22);
    }
  }
}

function scheduleEvent(ep){
  const id = setTimeout(() => {
    if (!playing) return;
    triggerEvent(ep);
    scheduleEvent(ep);
  }, 1200 + Math.random() * 3400);
  timers.push(id);
}

function play(){
  if (current < 0) return;
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const ep = EPISODES[current];
  buildScene(ep);
  playing = true;
  lastTick = performance.now();
  scheduleEvent(ep);
  updateUI();
}

function pause(){
  if (!playing) return;
  playing = false;
  stopScene();
  updateUI();
}

function finish(){
  playing = false;
  stopScene();
  elapsed = 0;
  updateUI();
  updateTime();
}

function selectStar(i){
  if (current === i && playing) { pause(); return; }
  if (current === i && !playing) { play(); return; }
  current = i;
  elapsed = 0;
  updateMeta();
  updateUI();
  play();
  updateTime();
}

function updateUI(){
  document.querySelectorAll('.star').forEach(el => {
    el.classList.toggle('active', +el.dataset.index === current);
  });
  playBtn.innerHTML = playing
    ? '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
}

function updateMeta(){
  if (current < 0) {
    nowTitle.textContent = 'Тишина';
    nowSub.textContent = 'выберите звезду';
    durEl.textContent = '0:00';
    return;
  }
  const ep = EPISODES[current];
  nowTitle.textContent = ep.title;
  nowSub.textContent = ep.sub;
  durEl.textContent = fmt(ep.dur);
}

function updateTime(){
  const d = current >= 0 ? EPISODES[current].dur : 0;
  curEl.textContent = fmt(elapsed);
  barFill.style.width = d ? Math.min(100, (elapsed / d) * 100) + '%' : '0%';
}

playBtn.addEventListener('click', () => {
  if (current < 0) { selectStar(0); return; }
  if (playing) pause(); else play();
});

setInterval(() => {
  if (!playing || current < 0) return;
  const now = performance.now();
  elapsed += (now - lastTick) / 1000;
  lastTick = now;
  const d = EPISODES[current].dur;
  if (elapsed >= d) { finish(); return; }
  updateTime();
}, 200);

let currentPage = 0;
let pageLock = false;

function goToPage(n){
  hint.style.opacity = '0';
  n = Math.max(0, Math.min(totalPages - 1, n));
  if (n === currentPage || pageLock) return;
  pageLock = true;
  currentPage = n;
  sky.style.transform = 'translateY(-' + (n * 100) + 'vh)';
  pageCurrentEl.textContent = n + 1;
  setTimeout(() => { pageLock = false; }, 950);
}

let wheelAccum = 0;
let wheelTimer = null;

window.addEventListener('wheel', (e) => {
  if (pageLock) return;
  wheelAccum += e.deltaY;
  clearTimeout(wheelTimer);
  wheelTimer = setTimeout(() => {
    if (Math.abs(wheelAccum) > 28) {
      if (wheelAccum > 0) goToPage(currentPage + 1);
      else goToPage(currentPage - 1);
    }
    wheelAccum = 0;
  }, 70);
}, { passive: true });

let touchY = 0;
let touchActive = false;

window.addEventListener('touchstart', (e) => {
  if (e.target.closest('.player')) return;
  touchY = e.touches[0].clientY;
  touchActive = true;
}, { passive: true });

window.addEventListener('touchend', (e) => {
  if (!touchActive) return;
  touchActive = false;
  const dy = touchY - e.changedTouches[0].clientY;
  if (Math.abs(dy) > 50) {
    if (dy > 0) goToPage(currentPage + 1);
    else goToPage(currentPage - 1);
  }
}, { passive: true });

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); goToPage(currentPage + 1); }
  else if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); goToPage(currentPage - 1); }
});

function drawViz(t){
  const w = viz.width, h = viz.height;
  if (!w || !h) return;
  vctx.clearRect(0, 0, w, h);
  if (analyser && playing) analyser.getByteFrequencyData(dataArr);
  const bars = 28;
  const bw = w / bars;
  const rgb = current >= 0 ? EPISODES[current].rgb : '200,215,255';
  for (let i = 0; i < bars; i++) {
    let v;
    if (playing && dataArr) {
      v = dataArr[Math.floor((i * dataArr.length) / bars / 1.25)] / 255;
    } else {
      v = 0.04 + 0.025 * Math.sin(t * 0.0018 + i * 0.55);
    }
    const bh = Math.max(2 * dpr, v * h * 0.95);
    vctx.fillStyle = 'rgba(' + rgb + ',' + (playing ? 0.85 : 0.22) + ')';
    vctx.fillRect(i * bw + bw * 0.28, (h - bh) / 2, bw * 0.44, bh);
  }
}

function loop(t){
  drawBg(t);
  drawViz(t);
  requestAnimationFrame(loop);
}

window.addEventListener('resize', resize);
document.addEventListener('pointerdown', () => {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}, { once: true });

resize();
updateMeta();
updateUI();
updateTime();
requestAnimationFrame(loop);
</script>
</body>
</html>
