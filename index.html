<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Страшилки</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#000;
    color:#b9b9c8;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

  canvas#bg{position:fixed;inset:0;z-index:0;display:block;background:#000}

  .grain{
    position:fixed;inset:-60%;z-index:2;pointer-events:none;opacity:.03;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
    animation:grainMove .9s steps(3) infinite;
  }
  @keyframes grainMove{
    0%{transform:translate(0,0)}
    33%{transform:translate(-3%,2%)}
    66%{transform:translate(2%,-3%)}
    100%{transform:translate(0,0)}
  }

  .vignette{
    position:fixed;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 42%, rgba(0,0,0,.5) 82%, rgba(0,0,0,.95) 100%);
  }

  #skyWrap{position:fixed;inset:0;z-index:4;overflow:hidden}
  #sky{
    position:absolute;top:0;left:0;width:100%;height:100%;
    transition:transform .95s cubic-bezier(.7,0,.28,1);
    will-change:transform;
  }
  .page{position:absolute;left:0;width:100%;height:100vh;overflow:hidden}
  .page-sky{position:absolute;inset:0;pointer-events:none}
  .page-sky svg{display:block;width:100%;height:100%}

  .star{
    position:absolute;width:56px;height:56px;
    transform:translate(-50%,-50%);
    background:none;border:none;padding:0;
    cursor:pointer;display:grid;place-items:center;
    -webkit-tap-highlight-color:transparent;
  }

  .star-core{
    position:absolute;top:50%;left:50%;
    width:4px;height:4px;border-radius:50%;
    background:#fff;
    transform:translate(-50%,-50%);
    box-shadow:0 0 6px 1.5px rgba(255,255,255,.7), 0 0 22px 6px rgba(255,255,255,.16);
    animation:twinkle 3.4s ease-in-out infinite;
    animation-delay:var(--delay);
    transition:background .5s, box-shadow .5s;
  }

  .star-flare{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);
    animation:twinkle 3.4s ease-in-out infinite;
    animation-delay:var(--delay);
    transition:background .5s;
  }
  .star-flare.h{
    width:26px;height:1px;
    background:radial-gradient(ellipse at center, rgba(255,255,255,.85) 0%, rgba(255,255,255,0) 78%);
  }
  .star-flare.v{
    width:1px;height:26px;
    background:radial-gradient(ellipse at center, rgba(255,255,255,.85) 0%, rgba(255,255,255,0) 78%);
  }

  @keyframes twinkle{
    0%,100%{opacity:.42}
    50%{opacity:.92}
  }

  .star-label{
    position:absolute;top:calc(100% - 2px);left:50%;
    transform:translate(-50%,-6px);
    white-space:nowrap;
    font-size:10px;letter-spacing:.2em;text-transform:uppercase;
    color:#9a94ac;
    opacity:0;transition:.35s ease;pointer-events:none;
    text-shadow:0 0 12px #000, 0 0 4px #000;
  }
  .star:hover .star-label,
  .star.active .star-label{opacity:1;transform:translate(-50%,0)}
  .star.active .star-label{color:#fff}

  .star:hover .star-core{
    box-shadow:0 0 10px 2px rgba(255,255,255,.95), 0 0 34px 10px rgba(255,255,255,.35);
  }

  .star.active .star-core{
    background:var(--c);
    box-shadow:0 0 12px 3px var(--c), 0 0 44px 12px var(--g);
    animation:twinkleFast 1.2s ease-in-out infinite;
  }
  .star.active .star-flare.h{
    background:radial-gradient(ellipse at center, var(--c) 0%, rgba(255,255,255,0) 80%);
  }
  .star.active .star-flare.v{
    background:radial-gradient(ellipse at center, var(--c) 0%, rgba(255,255,255,0) 80%);
  }
  @keyframes twinkleFast{
    0%,100%{opacity:.72}
    50%{opacity:1}
  }

  .pageNav{
    position:fixed;top:32px;right:28px;z-index:6;
    display:flex;gap:6px;align-items:baseline;
    font-size:11px;letter-spacing:.3em;
    color:rgba(255,255,255,.3);
    font-variant-numeric:tabular-nums;
    pointer-events:none;
  }
  .pageNav i{font-style:normal;opacity:.45}
  #pageCurrent{color:rgba(255,255,255,.85)}

  .hint{
    position:fixed;bottom:32px;left:50%;
    transform:translateX(-50%);
    z-index:5;
    font-size:10px;letter-spacing:.34em;text-transform:uppercase;
    color:rgba(255,255,255,.34);
    animation:hintPulse 2.6s ease-in-out infinite;
    pointer-events:none;
    transition:opacity .8s ease;
    white-space:nowrap;
  }
  @keyframes hintPulse{
    0%,100%{opacity:.3}
    50%{opacity:.72}
  }

  .flyingOrb{
    position:fixed;
    width:8px;height:8px;
    border-radius:50%;
    background:#fff;
    pointer-events:none;
    z-index:15;
    transform:translate(-50%,-50%) scale(1);
    box-shadow:0 0 20px 5px rgba(255,255,255,.85), 0 0 60px 20px rgba(255,255,255,.35);
  }

  #playerOverlay{
    position:fixed;inset:0;z-index:20;
    display:grid;place-items:center;
    background:radial-gradient(circle at 50% 42%, rgba(30,18,22,.55) 0%, rgba(0,0,0,.97) 72%);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    opacity:0;
    pointer-events:none;
    transition:opacity .4s ease;
  }
  #playerOverlay.show{
    opacity:1;
    pointer-events:auto;
  }

  .playerCard{
    position:relative;
    width:min(440px, 88vw);
    display:flex;flex-direction:column;
    align-items:center;
    gap:22px;
    padding:0 4px;
    transform:scale(.4);
    opacity:0;
    transition:transform .55s cubic-bezier(.2,.9,.3,1.3), opacity .4s ease;
  }
  #playerOverlay.show .playerCard{
    transform:scale(1);
    opacity:1;
  }

  .closeBtn{
    position:absolute;
    top:-52px;right:0;
    width:38px;height:38px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(0,0,0,.5);
    color:rgba(255,255,255,.65);
    font-size:22px;line-height:1;
    cursor:pointer;
    display:grid;place-items:center;
    transition:.25s ease;
    font-family:Arial,sans-serif;
  }
  .closeBtn:hover{color:#fff;border-color:rgba(255,255,255,.4)}

  .cover{
    width:100%;
    aspect-ratio:1/1;
    border-radius:14px;
    overflow:hidden;
    position:relative;
    box-shadow:
      0 30px 80px -20px rgba(0,0,0,.9),
      0 0 0 1px rgba(255,255,255,.05),
      0 0 70px -10px var(--ep-color, rgba(255,255,255,.15));
    background:#050505;
  }
  .cover svg{display:block;width:100%;height:100%}

  .titleBlock{
    width:100%;
    text-align:center;
  }
  .titleBlock h2{
    font-family:Georgia,"Times New Roman",serif;
    font-weight:400;
    font-size:clamp(17px, 4.5vw, 22px);
    letter-spacing:.05em;
    color:#ece8f3;
    line-height:1.3;
    text-shadow:0 0 24px var(--ep-color, transparent);
  }
  .titleBlock p{
    margin-top:8px;
    font-size:10px;letter-spacing:.3em;text-transform:uppercase;
    color:#615c76;
  }

  .progressRow{
    width:100%;
    display:flex;align-items:center;gap:12px;
  }
  .timeTxt{
    font-size:10.5px;
    letter-spacing:.1em;
    color:#615c76;
    font-variant-numeric:tabular-nums;
    min-width:36px;
  }
  .timeTxt.right{text-align:right}

  .progressBar{
    flex:1;
    height:3px;
    background:rgba(255,255,255,.09);
    border-radius:3px;
    position:relative;
    cursor:pointer;
    padding:8px 0;
    margin:-8px 0;
  }
  .progressBar::before{
    content:'';
    position:absolute;
    left:0;right:0;top:50%;
    height:3px;margin-top:-1.5px;
    background:rgba(255,255,255,.09);
    border-radius:3px;
  }
  .progressFill{
    position:absolute;
    left:0;top:50%;
    height:3px;margin-top:-1.5px;
    width:0%;
    background:var(--ep-color,#fff);
    border-radius:3px;
    box-shadow:0 0 10px var(--ep-color,#fff);
    transition:width .2s linear;
  }
  .progressKnob{
    position:absolute;
    top:50%;left:0%;
    width:11px;height:11px;
    border-radius:50%;
    background:#fff;
    transform:translate(-50%,-50%);
    box-shadow:0 0 10px var(--ep-color,#fff), 0 0 2px #000 inset;
    pointer-events:none;
    transition:left .2s linear;
  }

  .controls{
    width:100%;
    display:flex;align-items:center;justify-content:center;
    gap:34px;
  }
  .ctrlBtn{
    width:52px;height:52px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.03);
    color:rgba(255,255,255,.78);
    cursor:pointer;
    display:grid;place-items:center;
    transition:.25s ease;
  }
  .ctrlBtn svg{width:20px;height:20px;fill:currentColor}
  .ctrlBtn:hover{
    color:#fff;
    border-color:rgba(255,255,255,.35);
    box-shadow:0 0 22px -2px var(--ep-color, rgba(255,255,255,.3));
  }
  .ctrlBtn.main{
    width:66px;height:66px;
    border-color:rgba(255,255,255,.25);
    background:radial-gradient(circle at 35% 30%, rgba(60,50,60,.6), rgba(10,8,12,.95));
    color:#fff;
  }
  .ctrlBtn.main svg{width:26px;height:26px}
  .ctrlBtn.main:hover{
    box-shadow:0 0 30px -4px var(--ep-color, rgba(255,255,255,.4));
  }

  @media (max-width:640px){
    .pageNav{top:22px;right:18px;font-size:10px}
    .hint{bottom:24px;font-size:9px;letter-spacing:.28em}
    .playerCard{width:86vw;gap:18px}
    .closeBtn{top:-46px;width:34px;height:34px;font-size:20px}
    .controls{gap:28px}
    .ctrlBtn{width:46px;height:46px}
    .ctrlBtn.main{width:60px;height:60px}
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="grain"></div>
<div class="vignette"></div>

<div id="skyWrap">
  <div id="sky"></div>
</div>

<div class="pageNav">
  <span id="pageCurrent">1</span>
  <i>/</i>
  <span id="pageTotal">1</span>
</div>

<div class="hint" id="hint">прокрутите небо</div>

<div id="playerOverlay">
  <div class="playerCard" id="playerCard">
    <button class="closeBtn" id="closeBtn" aria-label="Закрыть">×</button>
    <div class="cover" id="cover"></div>
    <div class="titleBlock">
      <h2 id="pTitle">Тишина</h2>
      <p id="pSub">выберите звезду</p>
    </div>
    <div class="progressRow">
      <span class="timeTxt" id="pCur">0:00</span>
      <div class="progressBar" id="progressBar">
        <div class="progressFill" id="progressFill"></div>
        <div class="progressKnob" id="progressKnob"></div>
      </div>
      <span class="timeTxt right" id="pDur">0:00</span>
    </div>
    <div class="controls">
      <button class="ctrlBtn" id="prevBtn" aria-label="Назад">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="ctrlBtn main" id="playPauseBtn" aria-label="Пауза/воспроизведение">
        <svg viewBox="0 0 24 24" id="ppIcon"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
      </button>
      <button class="ctrlBtn" id="nextBtn" aria-label="Дальше">
        <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
function fmt(s){
  s = Math.max(0, Math.floor(s));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return m + ':' + (r < 10 ? '0' : '') + r;
}

const TITLES = [
  'Тот, кто стучит в стену',
  'Станция, которой нет на карте',
  'Колыбельная для утонувших',
  'Дом помнит своих гостей',
  'Последняя запись',
  'Голос из подвала',
  'Ночной поезд в никуда',
  'Шкаф с двойным дном',
  'Человек за окном',
  'Лес, который шепчет',
  'Зеркало с трещиной',
  'Гость на чердаке',
  'Сигнал с пустой частоты',
  'Кукла с закрытыми глазами',
  'Погреб, которого не было',
  'Сосед сверху',
  'Фотография без лица',
  'Тот, кто звонит в три',
  'Комната с обоями',
  'Дверь без ручки',
  'Птицы, что не поют',
  'Тень на потолке',
  'Запись №9',
  'Тот, кто ждёт в конце коридора'
];

const DURATIONS = [272,438,344,367,239,412,298,351,386,423,275,331,408,292,359,374,311,428,264,347,396,283,336,415];

const COLORS = [
  ['#ff3b52','255,59,82'],
  ['#ffb347','255,179,71'],
  ['#ffd84d','255,216,77'],
  ['#d94f8a','217,79,138'],
  ['#c44246','196,66,70'],
  ['#e8923b','232,146,59'],
  ['#ff7ab8','255,122,184'],
  ['#cc5588','204,85,136']
];

const PROFILES = [
  { tones:[[55,-7,'sine',.34],[82.4,6,'sine',.16],[110,-4,'triangle',.08],[41.2,3,'sine',.3]], filter:420, noiseFreq:700, noiseGain:.05 },
  { tones:[[110,-9,'sine',.24],[164.8,7,'sine',.15],[220,-5,'triangle',.06],[73.4,4,'sine',.2]], filter:880, noiseFreq:2400, noiseGain:.045 },
  { tones:[[73.4,5,'sine',.28],[110,-6,'sine',.17],[146.8,9,'triangle',.08],[36.7,-3,'sine',.24]], filter:520, noiseFreq:420, noiseGain:.06 },
  { tones:[[65.4,-8,'sine',.3],[98,6,'sine',.15],[130.8,-4,'triangle',.07],[43.7,2,'sine',.26]], filter:640, noiseFreq:1100, noiseGain:.05 },
  { tones:[[49,-10,'sine',.35],[73.4,8,'sine',.16],[98,-3,'triangle',.09],[32.7,5,'sine',.22]], filter:350, noiseFreq:900, noiseGain:.055 }
];

const EPISODES = TITLES.map((title, i) => {
  const [color, rgb] = COLORS[i % COLORS.length];
  const prof = PROFILES[i % PROFILES.length];
  const dur = DURATIONS[i % DURATIONS.length];
  return {
    title,
    sub: `Эпизод ${String(i+1).padStart(2,'0')} · ${fmt(dur)}`,
    dur, color, rgb,
    tones: prof.tones,
    filter: prof.filter,
    noiseFreq: prof.noiseFreq,
    noiseGain: prof.noiseGain
  };
});

const POSITIONS = [
  [16, 22], [48, 18], [80, 26],
  [14, 50], [44, 54], [74, 50],
  [30, 78], [60, 80]
];

const dpr = Math.min(window.devicePixelRatio || 1, 2);

const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
const sky = document.getElementById('sky');
const pageCurrentEl = document.getElementById('pageCurrent');
const pageTotalEl = document.getElementById('pageTotal');
const hint = document.getElementById('hint');
const overlay = document.getElementById('playerOverlay');
const playerCard = document.getElementById('playerCard');
const cover = document.getElementById('cover');
const pTitle = document.getElementById('pTitle');
const pSub = document.getElementById('pSub');
const pCur = document.getElementById('pCur');
const pDur = document.getElementById('pDur');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const progressKnob = document.getElementById('progressKnob');
const ppIcon = document.getElementById('ppIcon');

let W = 0, H = 0;

function resize(){
  W = canvas.width = Math.floor(innerWidth * dpr);
  H = canvas.height = Math.floor(innerHeight * dpr);
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
}

const spheres = [];
for (let i = 0; i < 6; i++) {
  spheres.push({
    x: 0.1 + Math.random() * 0.8,
    y: 0.1 + Math.random() * 0.8,
    r: 0.32 + Math.random() * 0.28,
    a: 0.02 + Math.random() * 0.035,
    fx: 0.00007 + Math.random() * 0.0001,
    fy: 0.00007 + Math.random() * 0.0001,
    ph: Math.random() * Math.PI * 2
  });
}

function drawBg(t){
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';

  spheres.forEach(s => {
    const x = (s.x + Math.sin(t * s.fx + s.ph) * 0.07) * W;
    const y = (s.y + Math.cos(t * s.fy + s.ph) * 0.06) * H;
    const r = s.r * Math.max(W, H);
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(255,255,255,' + s.a + ')');
    g.addColorStop(0.55, 'rgba(255,255,255,' + (s.a * 0.32) + ')');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, 6.2832);
    ctx.fill();
  });

  ctx.globalCompositeOperation = 'source-over';
}

function makeSkySVG(count){
  const W = 1000, H = 1000;
  let out = '';
  for (let i = 0; i < count; i++) {
    const x = (Math.random() * W).toFixed(1);
    const y = (Math.random() * H).toFixed(1);
    const r = (Math.random() * 1.6 + 0.3).toFixed(2);
    const o = (Math.random() * 0.65 + 0.08).toFixed(3);
    out += '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="#fff" opacity="' + o + '"/>';
  }
  for (let i = 0; i < 10; i++) {
    const x = (Math.random() * W).toFixed(1);
    const y = (Math.random() * H).toFixed(1);
    const r = (Math.random() * 1.1 + 0.5).toFixed(2);
    const o = (Math.random() * 0.35 + 0.1).toFixed(3);
    out += '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="#fff" opacity="' + o + '"/>';
  }
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid slice">' + out + '</svg>';
}

const PER_PAGE = POSITIONS.length;
const totalPages = Math.ceil(EPISODES.length / PER_PAGE);

const starEls = [];

for (let p = 0; p < totalPages; p++) {
  const page = document.createElement('div');
  page.className = 'page';
  page.style.top = (p * 100) + 'vh';

  const skyLayer = document.createElement('div');
  skyLayer.className = 'page-sky';
  skyLayer.innerHTML = makeSkySVG(230 + Math.floor(Math.random() * 90));
  page.appendChild(skyLayer);

  const start = p * PER_PAGE;
  const end = Math.min(start + PER_PAGE, EPISODES.length);
  for (let i = start; i < end; i++) {
    const pos = POSITIONS[i - start];
    const ep = EPISODES[i];
    const star = document.createElement('button');
    star.className = 'star';
    star.dataset.index = i;
    star.style.left = pos[0] + '%';
    star.style.top = pos[1] + '%';
    star.style.setProperty('--delay', (Math.random() * 4).toFixed(2) + 's');
    star.style.setProperty('--c', ep.color);
    star.style.setProperty('--g', 'rgba(' + ep.rgb + ',.55)');
    star.innerHTML =
      '<span class="star-flare h"></span>' +
      '<span class="star-flare v"></span>' +
      '<span class="star-core"></span>' +
      '<span class="star-label">' + ep.title + '</span>';
    star.addEventListener('click', () => handleStar(i, star));
    page.appendChild(star);
    starEls.push(star);
  }
  sky.appendChild(page);
}

pageTotalEl.textContent = totalPages;

let audioCtx = null, master = null;
let sceneBus = null, sceneNodes = [];
let timers = [];
let current = -1;
let playing = false;
let elapsed = 0;
let lastTick = 0;
let transitioning = false;

function initAudio(){
  if (audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AC();
  master = audioCtx.createGain();
  master.gain.value = 0.55;
  master.connect(audioCtx.destination);
}

function makeNoise(dur){
  const len = Math.floor(audioCtx.sampleRate * dur);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}

function buildScene(ep){
  const t0 = audioCtx.currentTime;
  const bus = audioCtx.createGain();
  bus.gain.setValueAtTime(0.0001, t0);
  bus.gain.exponentialRampToValueAtTime(0.85, t0 + 2.4);
  bus.connect(master);
  sceneBus = bus;

  const nodes = [bus];

  const droneFilter = audioCtx.createBiquadFilter();
  droneFilter.type = 'lowpass';
  droneFilter.frequency.value = ep.filter;
  droneFilter.Q.value = 5;
  droneFilter.connect(bus);

  const lfo = audioCtx.createOscillator();
  lfo.frequency.value = 0.06 + Math.random() * 0.05;
  const lfoGain = audioCtx.createGain();
  lfoGain.gain.value = ep.filter * 0.55;
  lfo.connect(lfoGain);
  lfoGain.connect(droneFilter.frequency);
  lfo.start(t0);
  nodes.push(lfo, lfoGain, droneFilter);

  ep.tones.forEach(([f, det, type, g]) => {
    const o = audioCtx.createOscillator();
    o.type = type;
    o.frequency.value = f;
    o.detune.value = det;
    const gain = audioCtx.createGain();
    gain.gain.value = g;
    o.connect(gain);
    gain.connect(droneFilter);
    o.start(t0);
    nodes.push(o, gain);
  });

  const noise = audioCtx.createBufferSource();
  noise.buffer = makeNoise(3);
  noise.loop = true;
  const nf = audioCtx.createBiquadFilter();
  nf.type = 'bandpass';
  nf.frequency.value = ep.noiseFreq;
  nf.Q.value = 0.9;
  const ng = audioCtx.createGain();
  ng.gain.value = ep.noiseGain;
  noise.connect(nf);
  nf.connect(ng);
  ng.connect(bus);
  noise.start(t0);
  nodes.push(noise, nf, ng);

  const tl = audioCtx.createOscillator();
  tl.frequency.value = 0.11 + Math.random() * 0.08;
  const tlg = audioCtx.createGain();
  tlg.gain.value = ep.noiseGain * 0.75;
  tl.connect(tlg);
  tlg.connect(ng.gain);
  tl.start(t0);
  nodes.push(tl, tlg);

  sceneNodes = nodes;
}

function stopScene(){
  timers.forEach(clearTimeout);
  timers = [];
  const nodes = sceneNodes;
  sceneNodes = [];
  sceneBus = null;
  if (!audioCtx || !nodes.length) return;

  const t = audioCtx.currentTime;
  const bus = nodes[0];
  try {
    bus.gain.cancelScheduledValues(t);
    bus.gain.setValueAtTime(Math.max(bus.gain.value, 0.0001), t);
    bus.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
  } catch (e) {}

  setTimeout(() => {
    nodes.forEach(n => {
      try { if (n.stop) n.stop(); } catch (e) {}
      try { n.disconnect(); } catch (e) {}
    });
  }, 1300);
}

function triggerEvent(){
  if (!audioCtx || !sceneBus) return;
  const t = audioCtx.currentTime;
  const k = Math.random();

  if (k < 0.3) {
    const o = audioCtx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(95, t);
    o.frequency.exponentialRampToValueAtTime(26, t + 0.75);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.45, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.95);
    o.connect(g);
    g.connect(sceneBus);
    o.start(t);
    o.stop(t + 1);
  } else if (k < 0.6) {
    const src = audioCtx.createBufferSource();
    src.buffer = makeNoise(1);
    const f = audioCtx.createBiquadFilter();
    f.type = 'bandpass';
    f.Q.value = 9;
    f.frequency.setValueAtTime(900 + Math.random() * 1300, t);
    f.frequency.linearRampToValueAtTime(600 + Math.random() * 700, t + 0.9);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.2, t + 0.25);
    g.gain.linearRampToValueAtTime(0.0001, t + 0.95);
    const pan = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
    src.connect(f);
    f.connect(g);
    if (pan) {
      pan.pan.value = Math.random() * 2 - 1;
      g.connect(pan);
      pan.connect(sceneBus);
    } else {
      g.connect(sceneBus);
    }
    src.start(t);
    src.stop(t + 1);
  } else if (k < 0.8) {
    const o = audioCtx.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(150, t);
    o.frequency.linearRampToValueAtTime(65 + Math.random() * 45, t + 1.2);
    const f = audioCtx.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = 520;
    f.Q.value = 13;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.1, t + 0.3);
    g.gain.linearRampToValueAtTime(0.0001, t + 1.2);
    o.connect(f);
    f.connect(g);
    g.connect(sceneBus);
    o.start(t);
    o.stop(t + 1.3);
  } else {
    for (let i = 0; i < 3; i++) {
      const tt = t + i * 0.29 + Math.random() * 0.05;
      const o = audioCtx.createOscillator();
      o.type = 'square';
      o.frequency.setValueAtTime(180, tt);
      o.frequency.exponentialRampToValueAtTime(58, tt + 0.13);
      const f = audioCtx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = 850;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.0001, tt);
      g.gain.exponentialRampToValueAtTime(0.24, tt + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, tt + 0.19);
      o.connect(f);
      f.connect(g);
      g.connect(sceneBus);
      o.start(tt);
      o.stop(tt + 0.22);
    }
  }
}

function scheduleEvent(){
  const id = setTimeout(() => {
    if (!playing) return;
    triggerEvent();
    scheduleEvent();
  }, 1200 + Math.random() * 3400);
  timers.push(id);
}

function play(){
  if (current < 0) return;
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  buildScene(EPISODES[current]);
  playing = true;
  lastTick = performance.now();
  scheduleEvent();
  updatePPIcon();
}

function pause(){
  if (!playing) return;
  playing = false;
  stopScene();
  updatePPIcon();
}

function finish(){
  playing = false;
  stopScene();
  elapsed = 0;
  updateProgress();
  updatePPIcon();
}

function updatePPIcon(){
  ppIcon.innerHTML = playing
    ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
}

function updateActiveStars(){
  starEls.forEach(el => {
    el.classList.toggle('active', +el.dataset.index === current);
  });
}

function makeCover(ep, index){
  const c = ep.color;
  const num = String(index + 1).padStart(2, '0');
  return '<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">' +
    '<defs>' +
      '<radialGradient id="cg" cx="42%" cy="36%">' +
        '<stop offset="0%" stop-color="' + c + '" stop-opacity="0.75"/>' +
        '<stop offset="45%" stop-color="' + c + '" stop-opacity="0.18"/>' +
        '<stop offset="100%" stop-color="#030303" stop-opacity="1"/>' +
      '</radialGradient>' +
      '<radialGradient id="cg2" cx="50%" cy="50%">' +
        '<stop offset="0%" stop-color="' + c + '" stop-opacity="0"/>' +
        '<stop offset="100%" stop-color="#000" stop-opacity="0.85"/>' +
      '</radialGradient>' +
    '</defs>' +
    '<rect width="400" height="400" fill="#050505"/>' +
    '<rect width="400" height="400" fill="url(#cg)"/>' +
    '<circle cx="200" cy="200" r="140" fill="none" stroke="' + c + '" stroke-opacity="0.22" stroke-width="0.8"/>' +
    '<circle cx="200" cy="200" r="100" fill="none" stroke="' + c + '" stroke-opacity="0.3" stroke-width="0.8"/>' +
    '<circle cx="200" cy="200" r="62" fill="none" stroke="' + c + '" stroke-opacity="0.45" stroke-width="1"/>' +
    '<circle cx="200" cy="200" r="28" fill="none" stroke="' + c + '" stroke-opacity="0.7" stroke-width="1.4"/>' +
    '<circle cx="200" cy="200" r="6" fill="' + c + '"/>' +
    '<circle cx="200" cy="200" r="4" fill="#fff" opacity="0.9"/>' +
    '<rect width="400" height="400" fill="url(#cg2)"/>' +
    '<text x="200" y="376" text-anchor="middle" font-family="Georgia,serif" font-size="13" letter-spacing="8" fill="' + c + '" fill-opacity="0.55">№ ' + num + '</text>' +
  '</svg>';
}

function updatePlayerUI(){
  const ep = EPISODES[current];
  pTitle.textContent = ep.title;
  pSub.textContent = ep.sub;
  pDur.textContent = fmt(ep.dur);
  cover.innerHTML = makeCover(ep, current);
  playerCard.style.setProperty('--ep-color', ep.color);
  updateProgress();
  updatePPIcon();
  updateActiveStars();
}

function updateProgress(){
  const d = current >= 0 ? EPISODES[current].dur : 0;
  const p = d ? Math.min(100, (elapsed / d) * 100) : 0;
  progressFill.style.width = p + '%';
  progressKnob.style.left = p + '%';
  pCur.textContent = fmt(elapsed);
}

function goToPage(n){
  hint.style.opacity = '0';
  const nn = Math.max(0, Math.min(totalPages - 1, n));
  if (nn === currentPage) return;
  currentPage = nn;
  sky.style.transform = 'translateY(-' + (nn * 100) + 'vh)';
  pageCurrentEl.textContent = nn + 1;
}

function loadEpisode(n){
  pause();
  current = n;
  elapsed = 0;
  const page = Math.floor(n / PER_PAGE);
  if (page !== currentPage) goToPage(page);
  updatePlayerUI();
  play();
}

function openPlayerOverlay(){
  overlay.classList.add('show');
  hint.style.opacity = '0';
}

function closePlayerOverlay(){
  overlay.classList.remove('show');
  pause();
}

function fallAndOpen(index, starEl){
  if (transitioning) return;
  transitioning = true;

  const rect = starEl.getBoundingClientRect();
  const sx = rect.left + rect.width / 2;
  const sy = rect.top + rect.height / 2;

  const orb = document.createElement('div');
  orb.className = 'flyingOrb';
  orb.style.left = sx + 'px';
  orb.style.top = sy + 'px';
  document.body.appendChild(orb);

  void orb.offsetWidth;

  orb.style.transition = 'left .72s cubic-bezier(.5,.05,.75,.4), top .72s cubic-bezier(.5,.05,.75,.4), transform .72s cubic-bezier(.5,.05,.75,.4), box-shadow .72s ease';
  orb.style.left = '50vw';
  orb.style.top = '50vh';
  orb.style.transform = 'translate(-50%,-50%) scale(2.2)';
  orb.style.boxShadow = '0 0 40px 15px rgba(255,255,255,.95), 0 0 120px 45px rgba(255,255,255,.4)';

  setTimeout(() => {
    orb.style.transition = 'transform .26s ease, opacity .26s ease';
    orb.style.transform = 'translate(-50%,-50%) scale(0)';
    orb.style.opacity = '0';

    current = index;
    elapsed = 0;
    updatePlayerUI();
    openPlayerOverlay();
    play();

    setTimeout(() => {
      orb.remove();
      transitioning = false;
    }, 280);
  }, 750);
}

function handleStar(index, starEl){
  if (transitioning) return;
  if (index === current) {
    openPlayerOverlay();
    if (!playing) play();
    return;
  }
  fallAndOpen(index, starEl);
}

document.getElementById('closeBtn').addEventListener('click', closePlayerOverlay);
overlay.addEventListener('click', (e) => {
  if (e.target === overlay) closePlayerOverlay();
});

document.getElementById('playPauseBtn').addEventListener('click', () => {
  if (current < 0) return;
  if (playing) pause();
  else {
    if (elapsed >= EPISODES[current].dur) elapsed = 0;
    play();
  }
});

document.getElementById('prevBtn').addEventListener('click', () => {
  if (current < 0) return;
  if (elapsed > 3) {
    elapsed = 0;
    updateProgress();
    return;
  }
  const n = (current - 1 + EPISODES.length) % EPISODES.length;
  loadEpisode(n);
});

document.getElementById('nextBtn').addEventListener('click', () => {
  if (current < 0) return;
  const n = (current + 1) % EPISODES.length;
  loadEpisode(n);
});

progressBar.addEventListener('click', (e) => {
  if (current < 0) return;
  const rect = progressBar.getBoundingClientRect();
  const p = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  elapsed = p * EPISODES[current].dur;
  updateProgress();
});

document.addEventListener('keydown', (e) => {
  if (overlay.classList.contains('show')) {
    if (e.key === 'Escape') closePlayerOverlay();
    return;
  }
  if (e.key === 'ArrowDown' || e.key === 'PageDown') {
    e.preventDefault();
    goToPage(currentPage + 1);
  } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
    e.preventDefault();
    goToPage(currentPage - 1);
  }
});

setInterval(() => {
  if (!playing || current < 0) return;
  const now = performance.now();
  elapsed += (now - lastTick) / 1000;
  lastTick = now;
  if (elapsed >= EPISODES[current].dur) { finish(); return; }
  updateProgress();
}, 200);

let currentPage = 0;
let wheelAccum = 0;
let wheelTimer = null;

window.addEventListener('wheel', (e) => {
  if (overlay.classList.contains('show')) return;
  wheelAccum += e.deltaY;
  clearTimeout(wheelTimer);
  wheelTimer = setTimeout(() => {
    if (Math.abs(wheelAccum) > 28) {
      if (wheelAccum > 0) goToPage(currentPage + 1);
      else goToPage(currentPage - 1);
    }
    wheelAccum = 0;
  }, 70);
}, { passive: true });

let touchY = 0;
let touchActive = false;

window.addEventListener('touchstart', (e) => {
  if (overlay.classList.contains('show')) return;
  touchY = e.touches[0].clientY;
  touchActive = true;
}, { passive: true });

window.addEventListener('touchend', (e) => {
  if (!touchActive) return;
  touchActive = false;
  const dy = touchY - e.changedTouches[0].clientY;
  if (Math.abs(dy) > 50) {
    if (dy > 0) goToPage(currentPage + 1);
    else goToPage(currentPage - 1);
  }
}, { passive: true });

let lastTime = 0;
function loop(t){
  drawBg(t);
  requestAnimationFrame(loop);
}

window.addEventListener('resize', resize);
document.addEventListener('pointerdown', () => {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}, { once: true });

resize();
updateActiveStars();
requestAnimationFrame(loop);
</script>
</body>
</html>
