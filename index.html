<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Страшилки</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#000;
    color:#c8c8d2;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

  canvas#bg{position:fixed;inset:0;z-index:0;display:block;background:#000}

  .grain{
    position:fixed;inset:-60%;z-index:2;pointer-events:none;opacity:.028;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
    animation:grainMove .9s steps(3) infinite;
  }
  @keyframes grainMove{
    0%{transform:translate(0,0)}
    33%{transform:translate(-3%,2%)}
    66%{transform:translate(2%,-3%)}
    100%{transform:translate(0,0)}
  }

  .vignette{
    position:fixed;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 38%, rgba(0,0,0,.6) 78%, rgba(0,0,0,.97) 100%);
  }

  #skyWrap{position:fixed;inset:0;z-index:4;overflow:hidden}
  #sky{
    position:absolute;top:0;left:0;width:100%;height:100%;
    transition:transform .95s cubic-bezier(.7,0,.28,1);
    will-change:transform;
  }
  .page{position:absolute;left:0;width:100%;height:100vh;overflow:hidden}
  .page-sky{position:absolute;inset:0;pointer-events:none}
  .page-sky svg{display:block;width:100%;height:100%}

  .star{
    position:absolute;
    width:110px;height:110px;
    transform:translate(-50%,-50%);
    background:none;border:none;padding:0;
    cursor:grab;display:grid;place-items:center;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
    z-index:5;
  }
  .star.dragging{opacity:0;pointer-events:none}

  .star-core{
    position:absolute;top:50%;left:50%;
    width:var(--core-size,8px);
    height:var(--core-size,8px);
    border-radius:50%;
    background:#fff;
    transform:translate(-50%,-50%);
    box-shadow:0 0 10px 3px rgba(255,255,255,.95), 0 0 32px 10px rgba(255,255,255,.28);
    animation:twinkle var(--pulse-dur,3s) ease-in-out infinite;
    animation-delay:var(--pulse-delay,0s);
    transition:transform .35s ease, box-shadow .35s ease;
  }
  @keyframes twinkle{
    0%,100%{opacity:.45}
    50%{opacity:1}
  }
  .star:hover .star-core{
    transform:translate(-50%,-50%) scale(1.7);
    box-shadow:0 0 16px 6px rgba(255,255,255,1), 0 0 52px 18px rgba(255,255,255,.5);
  }

  .star-flare{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);
    animation:twinkle var(--pulse-dur,3s) ease-in-out infinite;
    animation-delay:var(--pulse-delay,0s);
    pointer-events:none;
    opacity:.5;
    transition:opacity .35s ease;
  }
  .star-flare.h{
    width:var(--flare-w,44px);height:1px;
    background:radial-gradient(ellipse at center, rgba(255,255,255,.9) 0%, rgba(255,255,255,0) 78%);
  }
  .star-flare.v{
    width:1px;height:var(--flare-w,44px);
    background:radial-gradient(ellipse at center, rgba(255,255,255,.9) 0%, rgba(255,255,255,0) 78%);
  }
  .star:hover .star-flare{opacity:1}

  .star-label{
    position:absolute;top:calc(100% - 6px);left:50%;
    transform:translate(-50%,-6px);
    white-space:nowrap;
    font-size:10px;letter-spacing:.22em;text-transform:uppercase;
    color:#c8c3d6;
    opacity:0;transition:.35s ease;pointer-events:none;
    text-shadow:0 0 14px #000, 0 0 6px #000, 0 0 2px #000;
  }
  .star:hover .star-label,
  .star.active .star-label{opacity:1;transform:translate(-50%,0)}
  .star.active .star-label{color:#fff}

  .star.active .star-core{
    background:#fff;
    box-shadow:0 0 18px 6px #fff, 0 0 62px 20px rgba(255,255,255,.6);
    animation-duration:1.15s !important;
    animation-delay:0s !important;
  }

  .pageNav{
    position:fixed;top:32px;right:28px;z-index:6;
    display:flex;gap:6px;align-items:baseline;
    font-size:11px;letter-spacing:.3em;
    color:rgba(255,255,255,.28);
    font-variant-numeric:tabular-nums;
    pointer-events:none;
  }
  .pageNav i{font-style:normal;opacity:.4}
  #pageCurrent{color:rgba(255,255,255,.8)}

  .hint{
    position:fixed;bottom:32px;left:50%;
    transform:translateX(-50%);
    z-index:5;
    font-size:10px;letter-spacing:.34em;text-transform:uppercase;
    color:rgba(255,255,255,.26);
    animation:hintPulse 2.6s ease-in-out infinite;
    pointer-events:none;
    transition:opacity .8s ease;
    white-space:nowrap;
  }
  @keyframes hintPulse{
    0%,100%{opacity:.25}
    50%{opacity:.6}
  }

  .ghostStar{
    position:fixed;
    width:22px;height:22px;
    border-radius:50%;
    background:#fff;
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:200;
    box-shadow:0 0 30px 10px rgba(255,255,255,.85), 0 0 90px 30px rgba(255,255,255,.3);
  }
  .trailDot{
    position:fixed;
    width:9px;height:9px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 16px rgba(255,255,255,.9);
    transform:translate(-50%,-50%) scale(1);
    pointer-events:none;
    z-index:199;
    opacity:.9;
    transition:opacity .55s ease, transform .55s ease;
  }

  .dropzone{
    position:fixed;
    left:50%;bottom:44px;
    transform:translate(-50%, 30px);
    width:150px;height:150px;
    border-radius:50%;
    border:2px dashed rgba(255,255,255,.2);
    display:grid;place-items:center;
    z-index:120;
    pointer-events:none;
    opacity:0;
    transition:opacity .35s ease, transform .35s ease,
               border-color .25s ease, box-shadow .25s ease, background .25s ease;
  }
  .dropzone.visible{
    opacity:1;
    transform:translate(-50%, 0);
  }
  .dropzone.hover{
    border-color:#fff;
    border-style:solid;
    background:rgba(255,255,255,.07);
    box-shadow:0 0 60px rgba(255,255,255,.4), inset 0 0 60px rgba(255,255,255,.18);
  }
  .dropzone-label{
    font-size:9px;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:rgba(255,255,255,.45);
    text-align:center;
    line-height:1.7;
    pointer-events:none;
    transition:color .25s ease;
  }
  .dropzone.hover .dropzone-label{color:#fff}

  #playerOverlay{
    position:fixed;inset:0;z-index:40;
    display:grid;place-items:center;
    background:radial-gradient(circle at 50% 42%, rgba(18,18,22,.65) 0%, rgba(0,0,0,.98) 72%);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    opacity:0;
    pointer-events:none;
    transition:opacity .4s ease;
  }
  #playerOverlay.show{
    opacity:1;
    pointer-events:auto;
  }

  .playerCard{
    position:relative;
    width:min(440px, 88vw);
    display:flex;flex-direction:column;
    align-items:center;
    gap:22px;
    padding:0 4px;
    transform-origin:50% 100%;
    transform:translateY(35vh) scale(.35);
    opacity:0;
    transition:transform .65s cubic-bezier(.2,.9,.3,1.25), opacity .4s ease;
  }
  #playerOverlay.show .playerCard{
    transform:translateY(0) scale(1);
    opacity:1;
  }

  .closeBtn{
    position:absolute;
    top:-52px;right:0;
    width:38px;height:38px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.14);
    background:rgba(0,0,0,.5);
    color:rgba(255,255,255,.7);
    font-size:22px;line-height:1;
    cursor:pointer;
    display:grid;place-items:center;
    transition:.25s ease;
    font-family:Arial,sans-serif;
  }
  .closeBtn:hover{
    color:#fff;
    border-color:rgba(255,255,255,.5);
    box-shadow:0 0 20px rgba(255,255,255,.2);
  }

  .cover{
    width:100%;
    aspect-ratio:1/1;
    border-radius:14px;
    overflow:hidden;
    position:relative;
    box-shadow:
      0 30px 80px -20px rgba(0,0,0,.95),
      0 0 0 1px rgba(255,255,255,.06),
      0 0 70px -10px rgba(255,255,255,.08);
    background:#050505;
  }
  .cover svg{display:block;width:100%;height:100%}

  .titleBlock{width:100%;text-align:center}
  .titleBlock h2{
    font-family:Georgia,"Times New Roman",serif;
    font-weight:400;
    font-size:clamp(17px, 4.5vw, 22px);
    letter-spacing:.05em;
    color:#eae6f2;
    line-height:1.3;
    text-shadow:0 0 22px rgba(255,255,255,.14);
  }
  .titleBlock p{
    margin-top:8px;
    font-size:10px;letter-spacing:.3em;text-transform:uppercase;
    color:#5e596f;
  }

  .progressRow{
    width:100%;
    display:flex;align-items:center;gap:12px;
  }
  .timeTxt{
    font-size:10.5px;
    letter-spacing:.1em;
    color:#5e596f;
    font-variant-numeric:tabular-nums;
    min-width:36px;
  }
  .timeTxt.right{text-align:right}

  .progressBar{
    flex:1;
    height:3px;
    position:relative;
    cursor:pointer;
    padding:9px 0;
    margin:-9px 0;
  }
  .progressBar::before{
    content:'';
    position:absolute;
    left:0;right:0;top:50%;
    height:3px;margin-top:-1.5px;
    background:rgba(255,255,255,.1);
    border-radius:3px;
  }
  .progressFill{
    position:absolute;
    left:0;top:50%;
    height:3px;margin-top:-1.5px;
    width:0%;
    background:#fff;
    border-radius:3px;
    box-shadow:0 0 10px rgba(255,255,255,.85);
    transition:width .2s linear;
  }
  .progressKnob{
    position:absolute;
    top:50%;left:0%;
    width:11px;height:11px;
    border-radius:50%;
    background:#fff;
    transform:translate(-50%,-50%);
    box-shadow:0 0 12px rgba(255,255,255,.9);
    pointer-events:none;
    transition:left .2s linear;
  }

  .controls{
    width:100%;
    display:flex;align-items:center;justify-content:center;
    gap:34px;
  }
  .ctrlBtn{
    width:52px;height:52px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.03);
    color:rgba(255,255,255,.8);
    cursor:pointer;
    display:grid;place-items:center;
    transition:.25s ease;
  }
  .ctrlBtn svg{width:20px;height:20px;fill:currentColor}
  .ctrlBtn:hover{
    color:#fff;
    border-color:rgba(255,255,255,.4);
    box-shadow:0 0 22px -2px rgba(255,255,255,.3);
  }
  .ctrlBtn.main{
    width:66px;height:66px;
    border-color:rgba(255,255,255,.3);
    background:radial-gradient(circle at 35% 30%, rgba(70,70,80,.6), rgba(10,10,12,.95));
    color:#fff;
  }
  .ctrlBtn.main svg{width:26px;height:26px}
  .ctrlBtn.main:hover{
    box-shadow:0 0 34px -4px rgba(255,255,255,.45);
  }

  #miniPlayer{
    position:fixed;
    left:50%;bottom:22px;
    transform:translate(-50%, 200%);
    width:min(420px, calc(100% - 32px));
    display:grid;
    grid-template-columns:44px 1fr 40px;
    align-items:center;
    gap:12px;
    padding:10px 14px 10px 10px;
    background:rgba(8,8,10,.9);
    border:1px solid rgba(255,255,255,.1);
    border-radius:12px;
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    z-index:30;
    transition:transform .5s cubic-bezier(.2,.9,.3,1.2), opacity .35s ease;
    opacity:0;
    cursor:pointer;
    box-shadow:0 15px 50px rgba(0,0,0,.75), 0 0 0 1px rgba(0,0,0,.4);
  }
  #miniPlayer.show{
    transform:translate(-50%, 0);
    opacity:1;
  }
  #miniPlayer:hover{
    border-color:rgba(255,255,255,.22);
    box-shadow:0 15px 50px rgba(0,0,0,.85), 0 0 30px -8px rgba(255,255,255,.22);
  }

  .mini-cover{
    width:44px;height:44px;
    border-radius:7px;
    overflow:hidden;
    background:#050505;
    box-shadow:0 0 0 1px rgba(255,255,255,.08);
    pointer-events:none;
  }
  .mini-cover svg{display:block;width:100%;height:100%}

  .mini-info{
    min-width:0;
    display:flex;flex-direction:column;
    gap:7px;
    pointer-events:none;
  }
  .mini-title{
    font-size:12px;
    color:#e2ddee;
    letter-spacing:.02em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .mini-bar{
    height:2px;
    background:rgba(255,255,255,.1);
    border-radius:2px;
    overflow:hidden;
  }
  .mini-fill{
    height:100%;
    width:0%;
    background:#fff;
    box-shadow:0 0 8px rgba(255,255,255,.8);
    transition:width .2s linear;
  }

  .mini-btn{
    width:40px;height:40px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,.06);
    color:#fff;
    cursor:pointer;
    display:grid;place-items:center;
    transition:.25s ease;
  }
  .mini-btn:hover{background:rgba(255,255,255,.14)}
  .mini-btn svg{width:16px;height:16px;fill:currentColor}

  @media (max-width:640px){
    .pageNav{top:22px;right:18px;font-size:10px}
    .hint{bottom:20px;font-size:9px;letter-spacing:.28em}
    .star{width:100px;height:100px}
    .star-label{font-size:9px;letter-spacing:.16em;top:calc(100% + 0px)}
    .playerCard{width:86vw;gap:18px}
    .closeBtn{top:-46px;width:34px;height:34px;font-size:20px}
    .controls{gap:28px}
    .ctrlBtn{width:46px;height:46px}
    .ctrlBtn.main{width:60px;height:60px}
    .dropzone{width:120px;height:120px;bottom:80px}
    #miniPlayer{grid-template-columns:40px 1fr 36px;padding:8px 12px 8px 8px}
    .mini-cover{width:40px;height:40px}
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="grain"></div>
<div class="vignette"></div>

<div id="skyWrap">
  <div id="sky"></div>
</div>

<div class="pageNav">
  <span id="pageCurrent">1</span>
  <i>/</i>
  <span id="pageTotal">1</span>
</div>

<div class="hint" id="hint">прокрутите небо · коснитесь звезды</div>

<div class="dropzone" id="dropzone">
  <div class="dropzone-label">отпустите<br>здесь</div>
</div>

<div id="miniPlayer">
  <div class="mini-cover" id="miniCover"></div>
  <div class="mini-info">
    <div class="mini-title" id="miniTitle">—</div>
    <div class="mini-bar"><div class="mini-fill" id="miniFill"></div></div>
  </div>
  <button class="mini-btn" id="miniPlayBtn" aria-label="Play/Pause">
    <svg viewBox="0 0 24 24" id="miniPlayIcon"><path d="M8 5v14l11-7z"/></svg>
  </button>
</div>

<div id="playerOverlay">
  <div class="playerCard" id="playerCard">
    <button class="closeBtn" id="closeBtn" aria-label="Свернуть">×</button>
    <div class="cover" id="cover"></div>
    <div class="titleBlock">
      <h2 id="pTitle">—</h2>
      <p id="pSub">—</p>
    </div>
    <div class="progressRow">
      <span class="timeTxt" id="pCur">0:00</span>
      <div class="progressBar" id="progressBar">
        <div class="progressFill" id="progressFill"></div>
        <div class="progressKnob" id="progressKnob"></div>
      </div>
      <span class="timeTxt right" id="pDur">0:00</span>
    </div>
    <div class="controls">
      <button class="ctrlBtn" id="prevBtn" aria-label="Назад">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="ctrlBtn main" id="playPauseBtn" aria-label="Воспроизведение">
        <svg viewBox="0 0 24 24" id="ppIcon"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
      </button>
      <button class="ctrlBtn" id="nextBtn" aria-label="Дальше">
        <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
function fmt(s){
  s = Math.max(0, Math.floor(s));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return m + ':' + (r < 10 ? '0' : '') + r;
}

const TITLES = [
  'Тот, кто стучит в стену',
  'Станция, которой нет на карте',
  'Колыбельная для утонувших',
  'Дом помнит своих гостей',
  'Последняя запись',
  'Голос из подвала',
  'Ночной поезд в никуда',
  'Шкаф с двойным дном',
  'Человек за окном',
  'Лес, который шепчет',
  'Зеркало с трещиной',
  'Гость на чердаке',
  'Сигнал с пустой частоты',
  'Кукла с закрытыми глазами',
  'Погреб, которого не было',
  'Сосед сверху',
  'Фотография без лица',
  'Тот, кто звонит в три',
  'Комната с обоями',
  'Дверь без ручки',
  'Птицы, что не поют',
  'Тень на потолке',
  'Запись №9',
  'Тот, кто ждёт в конце коридора'
];
const DURATIONS = [272,438,344,367,239,412,298,351,386,423,275,331,408,292,359,374,311,428,264,347,396,283,336,415];
const PROFILES = [
  { tones:[[55,-7,'sine',.34],[82.4,6,'sine',.16],[110,-4,'triangle',.08],[41.2,3,'sine',.3]], filter:420, noiseFreq:700, noiseGain:.05 },
  { tones:[[110,-9,'sine',.24],[164.8,7,'sine',.15],[220,-5,'triangle',.06],[73.4,4,'sine',.2]], filter:880, noiseFreq:2400, noiseGain:.045 },
  { tones:[[73.4,5,'sine',.28],[110,-6,'sine',.17],[146.8,9,'triangle',.08],[36.7,-3,'sine',.24]], filter:520, noiseFreq:420, noiseGain:.06 },
  { tones:[[65.4,-8,'sine',.3],[98,6,'sine',.15],[130.8,-4,'triangle',.07],[43.7,2,'sine',.26]], filter:640, noiseFreq:1100, noiseGain:.05 },
  { tones:[[49,-10,'sine',.35],[73.4,8,'sine',.16],[98,-3,'triangle',.09],[32.7,5,'sine',.22]], filter:350, noiseFreq:900, noiseGain:.055 }
];
const EPISODES = TITLES.map((title, i) => {
  const prof = PROFILES[i % PROFILES.length];
  const dur = DURATIONS[i % DURATIONS.length];
  return {
    title,
    sub: fmt(dur),
    dur, tones: prof.tones, filter: prof.filter, noiseFreq: prof.noiseFreq, noiseGain: prof.noiseGain
  };
});

const dpr = Math.min(window.devicePixelRatio || 1, 2);
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
const sky = document.getElementById('sky');
const pageCurrentEl = document.getElementById('pageCurrent');
const pageTotalEl = document.getElementById('pageTotal');
const hint = document.getElementById('hint');
const dropzone = document.getElementById('dropzone');
const overlay = document.getElementById('playerOverlay');
const playerCard = document.getElementById('playerCard');
const cover = document.getElementById('cover');
const pTitle = document.getElementById('pTitle');
const pSub = document.getElementById('pSub');
const pCur = document.getElementById('pCur');
const pDur = document.getElementById('pDur');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const progressKnob = document.getElementById('progressKnob');
const ppIcon = document.getElementById('ppIcon');
const miniPlayer = document.getElementById('miniPlayer');
const miniCover = document.getElementById('miniCover');
const miniTitle = document.getElementById('miniTitle');
const miniFill = document.getElementById('miniFill');
const miniPlayBtn = document.getElementById('miniPlayBtn');
const miniPlayIcon = document.getElementById('miniPlayIcon');

let W = 0, H = 0;
function resize(){
  W = canvas.width = Math.floor(innerWidth * dpr);
  H = canvas.height = Math.floor(innerHeight * dpr);
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
}

const spheres = [];
for (let i = 0; i < 7; i++) {
  const deep = i < 2;
  spheres.push({
    x: 0.1 + Math.random() * 0.8,
    y: 0.1 + Math.random() * 0.8,
    r: 0.32 + Math.random() * 0.28,
    a: deep ? (0.006 + Math.random() * 0.006) : (0.007 + Math.random() * 0.009),
    fx: 0.00006 + Math.random() * 0.0001,
    fy: 0.00006 + Math.random() * 0.0001,
    ph: Math.random() * Math.PI * 2,
    color: deep ? [110, 8, 22] : [200, 200, 210]
  });
}

function drawBg(t){
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  spheres.forEach(s => {
    const x = (s.x + Math.sin(t * s.fx + s.ph) * 0.07) * W;
    const y = (s.y + Math.cos(t * s.fy + s.ph) * 0.06) * H;
    const r = s.r * Math.max(W, H);
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const c = s.color;
    g.addColorStop(0, 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + s.a + ')');
    g.addColorStop(0.55, 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (s.a * 0.3) + ')');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, 6.2832);
    ctx.fill();
  });
  ctx.globalCompositeOperation = 'source-over';
}

function makeSkySVG(count){
  const SW = 1000, SH = 1000;
  let out = '';
  for (let i = 0; i < count; i++) {
    const x = (Math.random() * SW).toFixed(1);
    const y = (Math.random() * SH).toFixed(1);
    const r = (Math.random() * 1.3 + 0.25).toFixed(2);
    const o = (Math.random() * 0.4 + 0.05).toFixed(3);
    out += '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="#fff" opacity="' + o + '"/>';
  }
  for (let i = 0; i < 6; i++) {
    const x = (Math.random() * SW).toFixed(1);
    const y = (Math.random() * SH).toFixed(1);
    const r = (Math.random() * 1.3 + 0.6).toFixed(2);
    const o = (Math.random() * 0.22 + 0.05).toFixed(3);
    out += '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="#fff" opacity="' + o + '"/>';
  }
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + SW + ' ' + SH + '" preserveAspectRatio="xMidYMid slice">' + out + '</svg>';
}

function generatePositions(count){
  const cols = 3, rows = 3;
  const cells = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) cells.push([c, r]);
  }
  for (let i = cells.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cells[i], cells[j]] = [cells[j], cells[i]];
  }
  const chosen = cells.slice(0, Math.min(count, cells.length));
  while (chosen.length < count) chosen.push([Math.random() * cols, Math.random() * rows]);
  const cw = 100 / cols;
  const rh = 100 / rows;
  return chosen.map(([c, r]) => {
    const x = cw * (c + 0.18 + Math.random() * 0.64);
    const y = rh * (r + 0.18 + Math.random() * 0.64);
    return [x, y];
  });
}

let audioCtx = null, master = null;
let sceneBus = null, sceneNodes = [];
let timers = [];
let current = -1;
let playing = false;
let elapsed = 0;
let lastTick = 0;
let transitioning = false;

function initAudio(){
  if (audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AC();
  master = audioCtx.createGain();
  master.gain.value = 0.55;
  master.connect(audioCtx.destination);
}
function makeNoise(dur){
  const len = Math.floor(audioCtx.sampleRate * dur);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}
function buildScene(ep){
  const t0 = audioCtx.currentTime;
  const bus = audioCtx.createGain();
  bus.gain.setValueAtTime(0.0001, t0);
  bus.gain.exponentialRampToValueAtTime(0.85, t0 + 2.4);
  bus.connect(master);
  sceneBus = bus;
  const nodes = [bus];
  const droneFilter = audioCtx.createBiquadFilter();
  droneFilter.type = 'lowpass';
  droneFilter.frequency.value = ep.filter;
  droneFilter.Q.value = 5;
  droneFilter.connect(bus);
  const lfo = audioCtx.createOscillator();
  lfo.frequency.value = 0.06 + Math.random() * 0.05;
  const lfoGain = audioCtx.createGain();
  lfoGain.gain.value = ep.filter * 0.55;
  lfo.connect(lfoGain);
  lfoGain.connect(droneFilter.frequency);
  lfo.start(t0);
  nodes.push(lfo, lfoGain, droneFilter);
  ep.tones.forEach(([f, det, type, g]) => {
    const o = audioCtx.createOscillator();
    o.type = type;
    o.frequency.value = f;
    o.detune.value = det;
    const gain = audioCtx.createGain();
    gain.gain.value = g;
    o.connect(gain);
    gain.connect(droneFilter);
    o.start(t0);
    nodes.push(o, gain);
  });
  const noise = audioCtx.createBufferSource();
  noise.buffer = makeNoise(3);
  noise.loop = true;
  const nf = audioCtx.createBiquadFilter();
  nf.type = 'bandpass';
  nf.frequency.value = ep.noiseFreq;
  nf.Q.value = 0.9;
  const ng = audioCtx.createGain();
  ng.gain.value = ep.noiseGain;
  noise.connect(nf);
  nf.connect(ng);
  ng.connect(bus);
  noise.start(t0);
  nodes.push(noise, nf, ng);
  const tl = audioCtx.createOscillator();
  tl.frequency.value = 0.11 + Math.random() * 0.08;
  const tlg = audioCtx.createGain();
  tlg.gain.value = ep.noiseGain * 0.75;
  tl.connect(tlg);
  tlg.connect(ng.gain);
  tl.start(t0);
  nodes.push(tl, tlg);
  sceneNodes = nodes;
}
function stopScene(){
  timers.forEach(clearTimeout);
  timers = [];
  const nodes = sceneNodes;
  sceneNodes = [];
  sceneBus = null;
  if (!audioCtx || !nodes.length) return;
  const t = audioCtx.currentTime;
  const bus = nodes[0];
  try {
    bus.gain.cancelScheduledValues(t);
    bus.gain.setValueAtTime(Math.max(bus.gain.value, 0.0001), t);
    bus.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
  } catch (e) {}
  setTimeout(() => {
    nodes.forEach(n => {
      try { if (n.stop) n.stop(); } catch (e) {}
      try { n.disconnect(); } catch (e) {}
    });
  }, 1300);
}
function triggerEvent(){
  if (!audioCtx || !sceneBus) return;
  const t = audioCtx.currentTime;
  const k = Math.random();
  if (k < 0.3) {
    const o = audioCtx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(95, t);
    o.frequency.exponentialRampToValueAtTime(26, t + 0.75);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.45, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.95);
    o.connect(g);
    g.connect(sceneBus);
    o.start(t);
    o.stop(t + 1);
  } else if (k < 0.6) {
    const src = audioCtx.createBufferSource();
    src.buffer = makeNoise(1);
    const f = audioCtx.createBiquadFilter();
    f.type = 'bandpass';
    f.Q.value = 9;
    f.frequency.setValueAtTime(900 + Math.random() * 1300, t);
    f.frequency.linearRampToValueAtTime(600 + Math.random() * 700, t + 0.9);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.2, t + 0.25);
    g.gain.linearRampToValueAtTime(0.0001, t + 0.95);
    const pan = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
    src.connect(f);
    f.connect(g);
    if (pan) {
      pan.pan.value = Math.random() * 2 - 1;
      g.connect(pan);
      pan.connect(sceneBus);
    } else g.connect(sceneBus);
    src.start(t);
    src.stop(t + 1);
  } else if (k < 0.8) {
    const o = audioCtx.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(150, t);
    o.frequency.linearRampToValueAtTime(65 + Math.random() * 45, t + 1.2);
    const f = audioCtx.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = 520;
    f.Q.value = 13;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.1, t + 0.3);
    g.gain.linearRampToValueAtTime(0.0001, t + 1.2);
    o.connect(f);
    f.connect(g);
    g.connect(sceneBus);
    o.start(t);
    o.stop(t + 1.3);
  } else {
    for (let i = 0; i < 3; i++) {
      const tt = t + i * 0.29 + Math.random() * 0.05;
      const o = audioCtx.createOscillator();
      o.type = 'square';
      o.frequency.setValueAtTime(180, tt);
      o.frequency.exponentialRampToValueAtTime(58, tt + 0.13);
      const f = audioCtx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = 850;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.0001, tt);
      g.gain.exponentialRampToValueAtTime(0.24, tt + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, tt + 0.19);
      o.connect(f);
      f.connect(g);
      g.connect(sceneBus);
      o.start(tt);
      o.stop(tt + 0.22);
    }
  }
}
function scheduleEvent(){
  const id = setTimeout(() => {
    if (!playing) return;
    triggerEvent();
    scheduleEvent();
  }, 1200 + Math.random() * 3400);
  timers.push(id);
}
function play(){
  if (current < 0) return;
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  buildScene(EPISODES[current]);
  playing = true;
  lastTick = performance.now();
  scheduleEvent();
  updateIcons();
}
function pause(){
  if (!playing) return;
  playing = false;
  stopScene();
  updateIcons();
}
function finish(){
  playing = false;
  stopScene();
  elapsed = 0;
  updateProgress();
  updateIcons();
}

let dragState = null;

function spawnTrail(x, y){
  const dot = document.createElement('div');
  dot.className = 'trailDot';
  dot.style.left = x + 'px';
  dot.style.top = y + 'px';
  document.body.appendChild(dot);
  requestAnimationFrame(() => {
    dot.style.opacity = '0';
    dot.style.transform = 'translate(-50%,-50%) scale(.25)';
  });
  setTimeout(() => dot.remove(), 600);
}

function startDrag(index, starEl, e){
  if (transitioning || dragState) return;
  e.preventDefault();
  hint.style.opacity = '0';
  const rect = starEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  const ghost = document.createElement('div');
  ghost.className = 'ghostStar';
  ghost.style.left = cx + 'px';
  ghost.style.top = cy + 'px';
  document.body.appendChild(ghost);

  starEl.classList.add('dragging');
  dropzone.classList.add('visible');
  miniPlayer.classList.remove('show');

  dragState = {
    index, starEl, ghost,
    startX: e.clientX, startY: e.clientY,
    moved: false,
    pid: e.pointerId,
    lastTrail: 0
  };

  window.addEventListener('pointermove', onDragMove);
  window.addEventListener('pointerup', onDragUp);
  window.addEventListener('pointercancel', onDragUp);
}

function onDragMove(e){
  if (!dragState || e.pointerId !== dragState.pid) return;
  const dx = e.clientX - dragState.startX;
  const dy = e.clientY - dragState.startY;
  if (Math.hypot(dx, dy) > 8) dragState.moved = true;

  dragState.ghost.style.left = e.clientX + 'px';
  dragState.ghost.style.top = e.clientY + 'px';

  const now = performance.now();
  if (now - dragState.lastTrail > 26) {
    spawnTrail(e.clientX, e.clientY);
    dragState.lastTrail = now;
  }

  const r = dropzone.getBoundingClientRect();
  const over = e.clientX > r.left && e.clientX < r.right &&
               e.clientY > r.top && e.clientY < r.bottom;
  dropzone.classList.toggle('hover', over);
}

function onDragUp(e){
  if (!dragState || e.pointerId !== dragState.pid) return;
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('pointerup', onDragUp);
  window.removeEventListener('pointercancel', onDragUp);

  const state = dragState;
  dragState = null;

  if (!state.moved) {
    transitioning = true;
    const g = state.ghost;
    dropzone.classList.remove('visible');
    g.style.transition = 'left .6s cubic-bezier(.5,0,.2,1), top .6s cubic-bezier(.5,0,.2,1), transform .6s ease, opacity .3s ease';
    g.style.left = '50vw';
    g.style.top = '50vh';
    g.style.transform = 'translate(-50%,-50%) scale(2.2)';
    setTimeout(() => {
      g.style.transform = 'translate(-50%,-50%) scale(0.15)';
      g.style.opacity = '0';
      setTimeout(() => {
        g.remove();
        state.starEl.classList.remove('dragging');
        current = state.index;
        elapsed = 0;
        updateFullUI();
        openOverlay();
        play();
        transitioning = false;
      }, 280);
    }, 600);
    return;
  }

  const r = dropzone.getBoundingClientRect();
  const over = e.clientX > r.left && e.clientX < r.right &&
               e.clientY > r.top && e.clientY < r.bottom;

  if (!over) {
    dropzone.classList.remove('visible', 'hover');
    const rect = state.starEl.getBoundingClientRect();
    const g = state.ghost;
    g.style.transition = 'left .5s cubic-bezier(.4,0,.3,1), top .5s cubic-bezier(.4,0,.3,1), opacity .4s ease, transform .5s ease';
    g.style.left = (rect.left + rect.width / 2) + 'px';
    g.style.top = (rect.top + rect.height / 2) + 'px';
    g.style.transform = 'translate(-50%,-50%) scale(0.3)';
    g.style.opacity = '0';
    setTimeout(() => {
      g.remove();
      state.starEl.classList.remove('dragging');
      if (current >= 0) miniPlayer.classList.add('show');
    }, 520);
    return;
  }

  transitioning = true;
  dropzone.classList.add('hover');
  const g = state.ghost;
  const targetX = r.left + r.width / 2;
  const targetY = r.top + r.height / 2;
  g.style.transition = 'left .48s cubic-bezier(.5,0,.2,1), top .48s cubic-bezier(.5,0,.2,1), transform .48s ease, opacity .3s ease';
  g.style.left = targetX + 'px';
  g.style.top = targetY + 'px';
  g.style.transform = 'translate(-50%,-50%) scale(2.1)';

  setTimeout(() => {
    g.style.transform = 'translate(-50%,-50%) scale(0.15)';
    g.style.opacity = '0';
    dropzone.classList.remove('hover');
    setTimeout(() => {
      g.remove();
      dropzone.classList.remove('visible');
      state.starEl.classList.remove('dragging');
      current = state.index;
      elapsed = 0;
      updateFullUI();
      openOverlay();
      play();
      setTimeout(() => { transitioning = false; }, 200);
    }, 280);
  }, 480);
}

let currentPage = 0;

function goToPage(n){
  hint.style.opacity = '0';
  const nn = Math.max(0, Math.min(totalPages - 1, n));
  if (nn === currentPage) return;
  currentPage = nn;
  sky.style.transform = 'translateY(-' + (nn * 100) + 'vh)';
  pageCurrentEl.textContent = nn + 1;
}

function loadEpisode(n, openOv){
  pause();
  current = n;
  elapsed = 0;
  const page = Math.floor(n / PER_PAGE);
  if (page !== currentPage) goToPage(page);
  updateFullUI();
  if (openOv) openOverlay();
  play();
}

document.getElementById('closeBtn').addEventListener('click', closeOverlay);
overlay.addEventListener('click', (e) => {
  if (e.target === overlay) closeOverlay();
});

document.getElementById('playPauseBtn').addEventListener('click', () => {
  if (current < 0) return;
  if (playing) pause();
  else {
    if (elapsed >= EPISODES[current].dur) elapsed = 0;
    play();
  }
});

document.getElementById('prevBtn').addEventListener('click', () => {
  if (current < 0) return;
  if (elapsed > 3) {
    elapsed = 0;
    updateProgress();
    return;
  }
  const n = (current - 1 + EPISODES.length) % EPISODES.length;
  loadEpisode(n, true);
});

document.getElementById('nextBtn').addEventListener('click', () => {
  if (current < 0) return;
  const n = (current + 1) % EPISODES.length;
  loadEpisode(n, true);
});

progressBar.addEventListener('click', (e) => {
  if (current < 0) return;
  const rect = progressBar.getBoundingClientRect();
  const p = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  elapsed = p * EPISODES[current].dur;
  updateProgress();
});

miniPlayer.addEventListener('click', (e) => {
  if (e.target.closest('#miniPlayBtn')) return;
  if (current < 0) return;
  openOverlay();
});

miniPlayBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  if (current < 0) return;
  if (playing) pause();
  else {
    if (elapsed >= EPISODES[current].dur) elapsed = 0;
    play();
  }
});

document.addEventListener('keydown', (e) => {
  if (overlay.classList.contains('show')) {
    if (e.key === 'Escape') closeOverlay();
    return;
  }
  if (dragState) return;
  if (e.key === 'ArrowDown' || e.key === 'PageDown') {
    e.preventDefault();
    goToPage(currentPage + 1);
  } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
    e.preventDefault();
    goToPage(currentPage - 1);
  }
});

setInterval(() => {
  if (!playing || current < 0) return;
  const now = performance.now();
  elapsed += (now - lastTick) / 1000;
  lastTick = now;
  if (elapsed >= EPISODES[current].dur) { finish(); return; }
  updateProgress();
}, 200);

let wheelAccum = 0;
let wheelTimer = null;

window.addEventListener('wheel', (e) => {
  if (overlay.classList.contains('show') || dragState) return;
  wheelAccum += e.deltaY;
  clearTimeout(wheelTimer);
  wheelTimer = setTimeout(() => {
    if (Math.abs(wheelAccum) > 28) {
      if (wheelAccum > 0) goToPage(currentPage + 1);
      else goToPage(currentPage - 1);
    }
    wheelAccum = 0;
  }, 70);
}, { passive: true });

let touchY = 0;
let touchActive = false;
window.addEventListener('touchstart', (e) => {
  if (overlay.classList.contains('show') || dragState) return;
  touchY = e.touches[0].clientY;
  touchActive = true;
}, { passive: true });
window.addEventListener('touchend', (e) => {
  if (!touchActive || dragState) return;
  touchActive = false;
  const dy = touchY - e.changedTouches[0].clientY;
  if (Math.abs(dy) > 55) {
    if (dy > 0) goToPage(currentPage + 1);
    else goToPage(currentPage - 1);
  }
}, { passive: true });

function loop(t){
  drawBg(t);
  requestAnimationFrame(loop);
}

window.addEventListener('resize', resize);
document.addEventListener('pointerdown', () => {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}, { once: true });

resize();
updateActiveStars();
updateIcons();
requestAnimationFrame(loop);
</script>
</body>
</html>
