<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Страшилки">
<title>Страшилки</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600&display=swap');

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#000;
    color:#c8c8d2;
    font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    font-weight:500;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  button, input, select, textarea{
    font-family:inherit;
    font-weight:inherit;
  }

  canvas#bg{position:fixed;inset:0;z-index:0;display:block;background:#000;contain:strict}

  .grain{
    position:fixed;inset:-60%;z-index:2;pointer-events:none;opacity:.026;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
    animation:grainMove .9s steps(3) infinite;
    will-change:transform;
    transform:translateZ(0);
  }
  @keyframes grainMove{
    0%{transform:translate3d(0,0,0)}
    33%{transform:translate3d(-3%,2%,0)}
    66%{transform:translate3d(2%,-3%,0)}
    100%{transform:translate3d(0,0,0)}
  }

  .vignette{
    position:fixed;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 36%, rgba(0,0,0,.62) 78%, rgba(0,0,0,.97) 100%);
  }

  #skyWrap{position:fixed;inset:0;z-index:4;overflow:hidden}
  #sky{
    position:absolute;top:0;left:0;width:100%;height:100%;
    transition:transform .95s cubic-bezier(.7,0,.28,1);
    will-change:transform;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
  }
  .page{position:absolute;left:0;width:100%;height:100vh;overflow:hidden;backface-visibility:hidden}
  .page-sky{position:absolute;inset:0;pointer-events:none}
  .page-sky svg{display:block;width:100%;height:100%}

  .star{
    position:absolute;
    width:78px;height:78px;
    transform:translate(-50%,-50%);
    background:none;border:none;padding:0;
    cursor:grab;display:grid;place-items:center;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
    z-index:5;
    backface-visibility:hidden;
  }
  .star.dragging{opacity:0;pointer-events:none}

  .star-core{
    position:absolute;top:50%;left:50%;
    width:var(--core-size,8px);
    height:var(--core-size,8px);
    border-radius:50%;
    background:#fff;
    transform:translate(-50%,-50%);
    box-shadow:0 0 10px 3px rgba(255,255,255,.95), 0 0 32px 10px rgba(255,255,255,.28);
    animation:twinkle var(--pulse-dur,3s) ease-in-out infinite;
    animation-delay:var(--pulse-delay,0s);
    transition:transform .35s ease, box-shadow .35s ease;
    backface-visibility:hidden;
  }
  @keyframes twinkle{
    0%,100%{opacity:.45}
    50%{opacity:1}
  }
  .star:hover .star-core{
    transform:translate(-50%,-50%) scale(1.7);
    box-shadow:0 0 16px 6px rgba(255,255,255,1), 0 0 52px 18px rgba(255,255,255,.5);
  }

  .star-flare{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);
    animation:twinkle var(--pulse-dur,3s) ease-in-out infinite;
    animation-delay:var(--pulse-delay,0s);
    pointer-events:none;
    opacity:.5;
    transition:opacity .35s ease;
  }
  .star-flare.h{
    width:var(--flare-w,44px);height:1px;
    background:radial-gradient(ellipse at center, rgba(255,255,255,.9) 0%, rgba(255,255,255,0) 78%);
  }
  .star-flare.v{
    width:1px;height:var(--flare-w,44px);
    background:radial-gradient(ellipse at center, rgba(255,255,255,.9) 0%, rgba(255,255,255,0) 78%);
  }
  .star:hover .star-flare{opacity:1}

  .star-label{
    position:absolute;top:calc(100% - 2px);left:50%;
    transform:translate(-50%,-6px);
    white-space:nowrap;
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    font-weight:500;
    color:#c8c3d6;
    opacity:0;transition:.35s ease;pointer-events:none;
    text-shadow:0 0 14px #000, 0 0 6px #000, 0 0 2px #000;
  }
  .star:hover .star-label,
  .star.active .star-label{opacity:1;transform:translate(-50%,0)}
  .star.active .star-label{color:#fff}

  .star.active .star-core{
    background:#fff;
    box-shadow:0 0 18px 6px #fff, 0 0 62px 20px rgba(255,255,255,.6);
    animation-duration:1.15s !important;
    animation-delay:0s !important;
  }

  .pageNav{
    position:fixed;top:32px;right:28px;z-index:6;
    display:flex;gap:8px;align-items:baseline;
    font-family:'Cinzel', Georgia, serif;
    font-size:14px;letter-spacing:.32em;
    font-weight:500;
    color:#fff;
    font-variant-numeric:tabular-nums;
    pointer-events:none;
    text-shadow:0 0 10px rgba(0,0,0,.95), 0 0 22px rgba(255,255,255,.22);
  }
  .pageNav i{font-style:normal;opacity:.55;color:#fff}
  #pageCurrent{color:#fff;opacity:1}

  #toastContainer{
    position:fixed;
    top:calc(env(safe-area-inset-top, 0px) + 16px);
    left:50%;
    transform:translateX(-50%);
    z-index:60;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    width:min(420px, calc(100% - 24px));
    pointer-events:none;
  }
  .toast{
    position:relative;
    pointer-events:auto;
    max-width:100%;
    padding:12px 22px;
    background:rgba(8,5,7,.94);
    border:1px solid rgba(255,255,255,.1);
    border-radius:3px;
    font-family:'Cormorant Garamond', Georgia, serif;
    font-weight:500;
    font-size:12px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:#ded9ea;
    text-align:center;
    box-shadow:0 10px 34px rgba(0,0,0,.85), 0 0 22px rgba(255,255,255,.03);
    transform:translate3d(0,-140%,0);
    opacity:0;
    transition:transform .45s cubic-bezier(.2,.9,.3,1.15), opacity .32s ease;
    will-change:transform,opacity;
    touch-action:none;
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    backface-visibility:hidden;
  }
  .toast.show{
    transform:translate3d(0,0,0);
    opacity:1;
  }

  .ghostStar{
    position:fixed;
    width:22px;height:22px;
    border-radius:50%;
    background:#fff;
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:200;
    box-shadow:0 0 30px 10px rgba(255,255,255,.85), 0 0 90px 30px rgba(255,255,255,.3);
    will-change:transform,left,top;
  }
  .trailDot{
    position:fixed;
    width:9px;height:9px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 16px rgba(255,255,255,.9);
    transform:translate(-50%,-50%) scale(1);
    pointer-events:none;
    z-index:199;
    opacity:.9;
    transition:opacity .55s ease, transform .55s ease;
  }
  .ghostLabel{
    position:fixed;
    transform:translate(-50%, 0);
    padding:0;
    background:none;
    border:none;
    font-family:'Cormorant Garamond', Georgia, serif;
    font-weight:500;
    font-size:11px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:#fff;
    white-space:nowrap;
    pointer-events:none;
    z-index:201;
    text-shadow:0 0 16px #000, 0 0 8px #000, 0 0 3px #000;
    max-width:82vw;
    overflow:hidden;
    text-overflow:ellipsis;
    will-change:left,top;
  }

  .dropzone{
    position:fixed;
    left:50%;bottom:44px;
    transform:translate(-50%, 30px);
    width:150px;height:150px;
    border-radius:50%;
    border:2px dashed rgba(255,255,255,.2);
    display:grid;place-items:center;
    z-index:120;
    pointer-events:none;
    opacity:0;
    transition:opacity .35s ease, transform .35s ease,
               border-color .25s ease, box-shadow .25s ease, background .25s ease;
  }
  .dropzone.visible{
    opacity:1;
    transform:translate(-50%, 0);
  }
  .dropzone.hover{
    border-color:#fff;
    border-style:solid;
    background:rgba(255,255,255,.07);
    box-shadow:0 0 60px rgba(255,255,255,.4), inset 0 0 60px rgba(255,255,255,.18);
  }
  .dropzone-label{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-weight:500;
    font-size:10px;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:rgba(255,255,255,.45);
    text-align:center;
    line-height:1.7;
    pointer-events:none;
    transition:color .25s ease;
  }
  .dropzone.hover .dropzone-label{color:#fff}

  #playerOverlay{
    position:fixed;inset:0;z-index:40;
    display:grid;place-items:center;
    background:radial-gradient(circle at 50% 42%, rgba(18,18,22,.65) 0%, rgba(0,0,0,.98) 72%);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    opacity:0;
    pointer-events:none;
    transition:opacity .4s ease;
  }
  #playerOverlay.show{
    opacity:1;
    pointer-events:auto;
  }

  .playerCard{
    position:relative;
    width:min(440px, 88vw);
    display:flex;flex-direction:column;
    align-items:center;
    gap:22px;
    padding:0 4px;
    transform-origin:50% 100%;
    transform:translateY(35vh) scale(.35);
    opacity:0;
    transition:transform .65s cubic-bezier(.2,.9,.3,1.25), opacity .4s ease;
    will-change:transform,opacity;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
  }
  #playerOverlay.show .playerCard{
    transform:translateY(0) scale(1);
    opacity:1;
  }

  .cover{
    width:100%;
    aspect-ratio:1/1;
    border-radius:14px;
    overflow:hidden;
    position:relative;
    box-shadow:
      0 30px 80px -20px rgba(0,0,0,.95),
      0 0 0 1px rgba(255,255,255,.06),
      0 0 70px -10px rgba(255,255,255,.08);
    background:#050505;
  }
  .cover svg{display:block;width:100%;height:100%}

  .titleBlock{width:100%;text-align:center}
  .titleBlock h2{
    font-family:'Cinzel', Georgia, serif;
    font-weight:500;
    font-size:clamp(18px, 4.6vw, 23px);
    letter-spacing:.08em;
    color:#eae6f2;
    line-height:1.3;
    text-shadow:0 0 22px rgba(255,255,255,.14);
  }

  .progressRow{
    width:100%;
    display:flex;align-items:center;gap:12px;
  }
  .timeTxt{
    font-family:'Cinzel', Georgia, serif;
    font-weight:400;
    font-size:11px;
    letter-spacing:.12em;
    color:#6a6480;
    font-variant-numeric:tabular-nums;
    min-width:36px;
  }
  .timeTxt.right{text-align:right}

  .progressBar{
    flex:1;
    height:3px;
    position:relative;
    cursor:pointer;
    padding:9px 0;
    margin:-9px 0;
  }
  .progressBar::before{
    content:'';
    position:absolute;
    left:0;right:0;top:50%;
    height:3px;margin-top:-1.5px;
    background:rgba(255,255,255,.1);
    border-radius:3px;
  }
  .progressFill{
    position:absolute;
    left:0;top:50%;
    height:3px;margin-top:-1.5px;
    width:100%;
    background:#fff;
    border-radius:3px;
    transform:scaleX(0);
    transform-origin:left center;
    box-shadow:0 0 10px rgba(255,255,255,.85);
    transition:transform .2s linear;
    will-change:transform;
  }
  .progressKnob{
    position:absolute;
    top:50%;left:0%;
    width:11px;height:11px;
    border-radius:50%;
    background:#fff;
    transform:translate(-50%,-50%);
    box-shadow:0 0 12px rgba(255,255,255,.9);
    pointer-events:none;
    transition:left .2s linear;
  }

  .controls{
    width:100%;
    display:flex;align-items:center;justify-content:center;
    gap:12px;
  }
  .ctrlBtn{
    width:48px;height:48px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.03);
    color:rgba(255,255,255,.75);
    cursor:pointer;
    display:grid;place-items:center;
    transition:color .25s ease, border-color .25s ease, box-shadow .25s ease, background .25s ease;
    flex-shrink:0;
  }
  .ctrlBtn svg{width:18px;height:18px;fill:currentColor}
  .ctrlBtn:hover{
    color:#fff;
    border-color:rgba(255,255,255,.4);
    box-shadow:0 0 22px -2px rgba(255,255,255,.3);
  }
  .ctrlBtn.main{
    width:62px;height:62px;
    border-color:rgba(255,255,255,.3);
    background:radial-gradient(circle at 35% 30%, rgba(70,70,80,.6), rgba(10,10,12,.95));
    color:#fff;
  }
  .ctrlBtn.main svg{width:24px;height:24px}
  .ctrlBtn.main:hover{
    box-shadow:0 0 34px -4px rgba(255,255,255,.45);
  }
  .ctrlBtn.minor{
    width:40px;height:40px;
    border:none;
    background:transparent;
    color:rgba(255,255,255,.42);
    box-shadow:none;
  }
  .ctrlBtn.minor svg{width:18px;height:18px}
  .ctrlBtn.minor:hover{
    color:#fff;
    background:transparent;
    border:none;
    box-shadow:none;
    filter:drop-shadow(0 0 8px rgba(255,255,255,.6));
  }
  .ctrlBtn.minor.active{
    color:#fff;
    background:transparent;
    border:none;
    box-shadow:none;
    filter:drop-shadow(0 0 10px rgba(255,255,255,.85));
  }
  #repeatBtn{margin-right:10px}
  #shuffleBtn{margin-left:10px}

  #miniPlayer{
    position:fixed;
    left:50%;bottom:22px;
    transform:translate(-50%, 200%);
    width:min(420px, calc(100% - 32px));
    display:grid;
    grid-template-columns:44px 1fr 40px;
    align-items:center;
    gap:12px;
    padding:10px 14px 10px 10px;
    background:rgba(8,8,10,.9);
    border:1px solid rgba(255,255,255,.1);
    border-radius:12px;
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    z-index:30;
    transition:transform .5s cubic-bezier(.2,.9,.3,1.2), opacity .35s ease;
    opacity:0;
    cursor:pointer;
    box-shadow:0 15px 50px rgba(0,0,0,.75), 0 0 0 1px rgba(0,0,0,.4);
    will-change:transform,opacity;
    backface-visibility:hidden;
  }
  #miniPlayer.show{
    transform:translate(-50%, 0);
    opacity:1;
  }
  #miniPlayer:hover{
    border-color:rgba(255,255,255,.22);
    box-shadow:0 15px 50px rgba(0,0,0,.85), 0 0 30px -8px rgba(255,255,255,.22);
  }

  .mini-cover{
    width:44px;height:44px;
    border-radius:7px;
    overflow:hidden;
    background:#050505;
    box-shadow:0 0 0 1px rgba(255,255,255,.08);
    pointer-events:none;
  }
  .mini-cover svg{display:block;width:100%;height:100%}

  .mini-info{
    min-width:0;
    display:flex;flex-direction:column;
    gap:7px;
    pointer-events:none;
  }
  .mini-title{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-weight:500;
    font-size:14px;
    color:#e2ddee;
    letter-spacing:.03em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .mini-bar{
    height:2px;
    background:rgba(255,255,255,.1);
    border-radius:2px;
    overflow:hidden;
  }
  .mini-fill{
    height:100%;
    width:100%;
    background:#fff;
    box-shadow:0 0 8px rgba(255,255,255,.8);
    transform:scaleX(0);
    transform-origin:left center;
    transition:transform .2s linear;
    will-change:transform;
  }

  .mini-btn{
    width:40px;height:40px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,.06);
    color:#fff;
    cursor:pointer;
    display:grid;place-items:center;
    transition:.25s ease;
  }
  .mini-btn:hover{background:rgba(255,255,255,.14)}
  .mini-btn svg{width:16px;height:16px;fill:currentColor}

  /* ===== AGE GATE ===== */
  #ageGate{
    position:fixed;inset:0;z-index:100;
    background:#08080b;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:48px 28px;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:1;
    transition:opacity .55s ease;
    overscroll-behavior:contain;
  }
  #ageGate.hide{opacity:0;pointer-events:none}

  #ageGateInner{
    width:100%;
    max-width:460px;
    display:flex;
    flex-direction:column;
  }

  .ageEyebrow{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-weight:500;
    font-size:11px;
    letter-spacing:.36em;
    text-transform:uppercase;
    color:#4a4658;
    margin-bottom:18px;
  }

  .ageNum{
    font-family:'Cinzel', Georgia, serif;
    font-weight:400;
    font-size:clamp(110px, 26vw, 180px);
    line-height:.82;
    color:#f3eff8;
    letter-spacing:-.04em;
    display:flex;
    align-items:flex-start;
    margin-bottom:32px;
    user-select:none;
  }
  .ageNum span{
    font-size:.32em;
    margin-left:.08em;
    margin-top:.14em;
    font-weight:500;
  }

  .ageRule{
    width:100%;
    height:1px;
    background:rgba(255,255,255,.1);
    margin-bottom:24px;
  }

  .ageTitle{
    font-family:'Cinzel', Georgia, serif;
    font-weight:500;
    font-size:clamp(15px, 3.4vw, 18px);
    letter-spacing:.42em;
    text-indent:.42em;
    color:#eae6f2;
    margin-bottom:22px;
  }

  .ageBody{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-weight:500;
    font-size:15px;
    line-height:1.7;
    color:#a8a2b5;
    display:flex;
    flex-direction:column;
    gap:14px;
    margin-bottom:32px;
  }
  .ageBody p{margin:0}

  .ageEnter{
    align-self:flex-start;
    padding:15px 38px;
    background:transparent;
    border:1px solid rgba(255,255,255,.28);
    color:#eae6f2;
    font-family:'Cinzel', Georgia, serif;
    font-size:12px;
    letter-spacing:.42em;
    text-indent:.42em;
    text-transform:uppercase;
    cursor:pointer;
    border-radius:0;
    transition:color .25s ease, border-color .25s ease, background .25s ease, transform .2s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .ageEnter:hover{
    color:#08080b;
    background:#f3eff8;
    border-color:#f3eff8;
  }
  .ageEnter:active{
    transform:scale(.98);
  }

  @media (max-width:768px){
    .grain{animation:none}
    #playerOverlay{
      backdrop-filter:none;
      -webkit-backdrop-filter:none;
      background:radial-gradient(circle at 50% 42%, rgba(16,16,20,.94) 0%, rgba(0,0,0,.985) 72%);
    }
    #miniPlayer{
      backdrop-filter:none;
      -webkit-backdrop-filter:none;
      background:rgba(8,8,10,.97);
    }
    .toast{
      backdrop-filter:none;
      -webkit-backdrop-filter:none;
    }
    #sky{transition:transform .8s cubic-bezier(.7,0,.28,1)}
  }

  @media (max-width:640px){
    .pageNav{top:22px;right:18px;font-size:13px;letter-spacing:.28em;gap:7px}
    .star{width:68px;height:68px}
    .star-label{font-size:9.5px;letter-spacing:.14em;top:calc(100% + 2px)}
    .toast{font-size:10px;padding:10px 16px;letter-spacing:.18em}
    .playerCard{width:88vw;gap:20px}
    .controls{gap:8px}
    .ctrlBtn{width:42px;height:42px}
    .ctrlBtn svg{width:16px;height:16px}
    .ctrlBtn.main{width:56px;height:56px}
    .ctrlBtn.main svg{width:22px;height:22px}
    .ctrlBtn.minor{width:36px;height:36px}
    .ctrlBtn.minor svg{width:16px;height:16px}
    #repeatBtn{margin-right:4px}
    #shuffleBtn{margin-left:4px}
    .dropzone{width:120px;height:120px;bottom:80px}
    #miniPlayer{grid-template-columns:40px 1fr 36px;padding:8px 12px 8px 8px}
    .mini-cover{width:40px;height:40px}
    .mini-title{font-size:13px}
    .ghostLabel{font-size:10px;letter-spacing:.16em}

    #ageGate{padding:32px 24px}
    .ageBody{font-size:14px;gap:12px}
    .ageNum{margin-bottom:26px}
    .ageRule{margin-bottom:20px}
    .ageEnter{padding:13px 30px;font-size:11px;letter-spacing:.38em;text-indent:.38em}
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="grain"></div>
<div class="vignette"></div>

<div id="skyWrap">
  <div id="sky"></div>
</div>

<div class="pageNav">

/* ================= TOASTS ================= */
function showToast(text, duration){
  if (!text) return;
  while (toastContainer.children.length >= 3) {
    toastContainer.firstChild.remove();
  }
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = text;
  toastContainer.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));

  let timer = null;
  let dismissed = false;
  const dismiss = () => {
    if (dismissed) return;
    dismissed = true;
    clearTimeout(timer);
    el.classList.remove('show');
    setTimeout(() => el.remove(), 480);
  };
  if (duration) timer = setTimeout(dismiss, duration);

  let sx = 0, sy = 0, dx = 0, dy = 0, dragging = false, moved = false;
  el.addEventListener('pointerdown', (e) => {
    if (!e.isPrimary) return;
    dragging = true;
    moved = false;
    sx = e.clientX;
    sy = e.clientY;
    dx = 0;
    dy = 0;
    el.style.transition = 'none';
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
  });
  el.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    dx = e.clientX - sx;
    dy = e.clientY - sy;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) moved = true;
    const cy = Math.min(0, dy);
    el.style.transform = 'translate3d(' + dx + 'px,' + cy + 'px,0)';
    el.style.opacity = String(Math.max(0.1, 1 - (Math.abs(dx) / 200 + Math.abs(dy) / 140)));
  });
  const end = () => {
    if (!dragging) return;
    dragging = false;
    el.style.transition = '';
    if (Math.abs(dx) > 70 || dy < -40) {
      dismiss();
    } else {
      el.style.transform = '';
      el.style.opacity = '';
    }
    dx = dy = 0;
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('click', () => {
    if (!moved) dismiss();
  });
  return el;
}

function drawBg(t){
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  spheres.forEach(s => {
    const x = (s.x + Math.sin(t * s.fx + s.ph) * 0.07) * W;
    const y = (s.y + Math.cos(t * s.fy + s.ph) * 0.06) * H;
    const r = s.r * Math.max(W, H);
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const c = s.color;
    g.addColorStop(0, 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + s.a + ')');
    g.addColorStop(0.55, 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (s.a * 0.3) + ')');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, 6.2832);
    ctx.fill();
  });
  ctx.globalCompositeOperation = 'source-over';
}

function generatePositions(count){
  const cols = 4, rows = 3;
  const cells = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) cells.push([c, r]);
  }
  for (let i = cells.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cells[i], cells[j]] = [cells[j], cells[i]];
  }
  const chosen = cells.slice(0, Math.min(count, cells.length));
  while (chosen.length < count) {
    chosen.push([Math.random() * cols, Math.random() * rows]);
  }
  const cw = 100 / cols;
  const rh = 100 / rows;
  return chosen.map(([c, r]) => {
    const x = cw * (c + 0.18 + Math.random() * 0.64);
    const y = rh * (r + 0.2 + Math.random() * 0.6);
    return [x, y];
  });
}

/* ================= AUDIO ================= */
let audioCtx = null, master = null;
let sceneBus = null, sceneNodes = [];
let timers = [];
let current = -1;
let playing = false;
let elapsed = 0;
let lastTick = 0;
let transitioning = false;
let repeatMode = 'off';
let shuffleOn = false;
let shuffleOrder = [];
let shufflePosition = 0;
let overlayHintShown = false;

function initAudio(){
  if (audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AC();
  master = audioCtx.createGain();
  master.gain.value = 0.55;
  master.connect(audioCtx.destination);
}
function makeNoise(dur){
  const len = Math.floor(audioCtx.sampleRate * dur);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}
function buildScene(ep){
  const t0 = audioCtx.currentTime;
  const bus = audioCtx.createGain();
  bus.gain.setValueAtTime(0.0001, t0);
  bus.gain.exponentialRampToValueAtTime(0.85, t0 + 2.4);
  bus.connect(master);
  sceneBus = bus;
  const nodes = [bus];
  const droneFilter = audioCtx.createBiquadFilter();
  droneFilter.type = 'lowpass';
  droneFilter.frequency.value = ep.filter;
  droneFilter.Q.value = 5;
  droneFilter.connect(bus);
  const lfo = audioCtx.createOscillator();
  lfo.frequency.value = 0.06 + Math.random() * 0.05;
  const lfoGain = audioCtx.createGain();
  lfoGain.gain.value = ep.filter * 0.55;
  lfo.connect(lfoGain);
  lfoGain.connect(droneFilter.frequency);
  lfo.start(t0);
  nodes.push(lfo, lfoGain, droneFilter);
  ep.tones.forEach(([f, det, type, g]) => {
    const o = audioCtx.createOscillator();
    o.type = type;
    o.frequency.value = f;
    o.detune.value = det;
    const gain = audioCtx.createGain();
    gain.gain.value = g;
    o.connect(gain);
    gain.connect(droneFilter);
    o.start(t0);
    nodes.push(o, gain);
  });
  const noise = audioCtx.createBufferSource();
  noise.buffer = makeNoise(3);
  noise.loop = true;
  const nf = audioCtx.createBiquadFilter();
  nf.type = 'bandpass';
  nf.frequency.value = ep.noiseFreq;
  nf.Q.value = 0.9;
  const ng = audioCtx.createGain();
  ng.gain.value = ep.noiseGain;
  noise.connect(nf);
  nf.connect(ng);
  ng.connect(bus);
  noise.start(t0);
  nodes.push(noise, nf, ng);
  const tl = audioCtx.createOscillator();
  tl.frequency.value = 0.11 + Math.random() * 0.08;
  const tlg = audioCtx.createGain();
  tlg.gain.value = ep.noiseGain * 0.75;
  tl.connect(tlg);
  tlg.connect(ng.gain);
  tl.start(t0);
  nodes.push(tl, tlg);
  sceneNodes = nodes;
}
function stopScene(){
  timers.forEach(clearTimeout);
  timers = [];
  const nodes = sceneNodes;
  sceneNodes = [];
  sceneBus = null;
  if (!audioCtx || !nodes.length) return;
  const t = audioCtx.currentTime;
  const bus = nodes[0];
  try {
    bus.gain.cancelScheduledValues(t);
    bus.gain.setValueAtTime(Math.max(bus.gain.value, 0.0001), t);
    bus.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
  } catch (e) {}
  setTimeout(() => {
    nodes.forEach(n => {
      try { if (n.stop) n.stop(); } catch (e) {}
      try { n.disconnect(); } catch (e) {}
    });
  }, 1300);
}
function triggerEvent(){
  if (!audioCtx || !sceneBus) return;
  const t = audioCtx.currentTime;
  const k = Math.random();
  if (k < 0.3) {
    const o = audioCtx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(95, t);
    o.frequency.exponentialRampToValueAtTime(26, t + 0.75);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.45, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.95);
    o.connect(g);
    g.connect(sceneBus);
    o.start(t);
    o.stop(t + 1);
  } else if (k < 0.6) {
    const src = audioCtx.createBufferSource();
    src.buffer = makeNoise(1);
    const f = audioCtx.createBiquadFilter();
    f.type = 'bandpass';
    f.Q.value = 9;
    f.frequency.setValueAtTime(900 + Math.random() * 1300, t);
    f.frequency.linearRampToValueAtTime(600 + Math.random() * 700, t + 0.9);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.2, t + 0.25);
    g.gain.linearRampToValueAtTime(0.0001, t + 0.95);
    const pan = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
    src.connect(f);
    f.connect(g);
    if (pan) {
      pan.pan.value = Math.random() * 2 - 1;
      g.connect(pan);
      pan.connect(sceneBus);
    } else g.connect(sceneBus);
    src.start(t);
    src.stop(t + 1);
  } else if (k < 0.8) {
    const o = audioCtx.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(150, t);
    o.frequency.linearRampToValueAtTime(65 + Math.random() * 45, t + 1.2);
    const f = audioCtx.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = 520;
    f.Q.value = 13;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.1, t + 0.3);
    g.gain.linearRampToValueAtTime(0.0001, t + 1.2);
    o.connect(f);
    f.connect(g);
    g.connect(sceneBus);
    o.start(t);
    o.stop(t + 1.3);
  } else {
    for (let i = 0; i < 3; i++) {
      const tt = t + i * 0.29 + Math.random() * 0.05;
      const o = audioCtx.createOscillator();
      o.type = 'square';
      o.frequency.setValueAtTime(180, tt);
      o.frequency.exponentialRampToValueAtTime(58, tt + 0.13);
      const f = audioCtx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = 850;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.0001, tt);
      g.gain.exponentialRampToValueAtTime(0.24, tt + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, tt + 0.19);
      o.connect(f);
      f.connect(g);
      g.connect(sceneBus);
      o.start(tt);
      o.stop(tt + 0.22);
    }
  }
}
function scheduleEvent(){
  const id = setTimeout(() => {
    if (!playing) return;
    triggerEvent();
    scheduleEvent();
  }, 1200 + Math.random() * 3400);
  timers.push(id);
}
function play(){
  if (current < 0) return;
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  buildScene(EPISODES[current]);
  playing = true;
  lastTick = performance.now();
  scheduleEvent();
  updateIcons();
}
function pause(){
  if (!playing) return;
  playing = false;
  stopScene();
  updateIcons();
}
function finish(){
  playing = false;
  stopScene();
  elapsed = 0;
  updateProgress();
  updateIcons();
}

/* ================= SHUFFLE ================= */
function buildShuffleOrder(startIndex){
  shuffleOrder = EPISODES.map((_, i) => i);
  for (let i = shuffleOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffleOrder[i], shuffleOrder[j]] = [shuffleOrder[j], shuffleOrder[i]];
  }
  if (startIndex >= 0) {
    const idx = shuffleOrder.indexOf(startIndex);
    if (idx > 0) {
      shuffleOrder.splice(idx, 1);
      shuffleOrder.unshift(startIndex);
    }
  }
  shufflePosition = 0;
}

function getNextIndex(){
  if (shuffleOn) {
    if (shufflePosition >= shuffleOrder.length - 1) {
      if (repeatMode === 'all') {
        buildShuffleOrder(-1);
        return shuffleOrder[0];
      }
      return -1;
    }
    shufflePosition++;
    return shuffleOrder[shufflePosition];
  }
  const next = current + 1;
  if (next >= EPISODES.length) {
    if (repeatMode === 'all') return 0;
    return -1;
  }
  return next;
}

function getPrevIndex(){
  if (shuffleOn) {
    if (shufflePosition <= 0) return -1;
    shufflePosition--;
    return shuffleOrder[shufflePosition];
  }
  return (current - 1 + EPISODES.length) % EPISODES.length;
}

function onTrackEnd(){
  if (repeatMode === 'one') {
    elapsed = 0;
    updateProgress();
    play();
    return;
  }
  const next = getNextIndex();
  if (next < 0) { finish(); return; }
  loadEpisode(next);
}

/* ================= COVER ================= */
const coverCache = {};
function makeCoverSVG(index){
  if (coverCache[index]) return coverCache[index];
  const id = 'cbg' + index;
  const svg = '<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">' +
    '<defs>' +
      '<radialGradient id="' + id + '" cx="50%" cy="42%">' +
        '<stop offset="0%" stop-color="#1a1a1e"/>' +
        '<stop offset="55%" stop-color="#09090b"/>' +
        '<stop offset="100%" stop-color="#000"/>' +
      '</radialGradient>' +
    '</defs>' +
    '<rect width="400" height="400" fill="url(#' + id + ')"/>' +
    '<g transform="translate(200 200)">' +
      '<rect x="-26" y="-84" width="52" height="98" rx="26" fill="#fff" fill-opacity="0.9"/>' +
      '<g stroke="#0a0a0a" stroke-width="1.6" stroke-opacity="0.35">' +
        '<line x1="-16" y1="-64" x2="16" y2="-64"/>' +
        '<line x1="-16" y1="-49" x2="16" y2="-49"/>' +
        '<line x1="-16" y1="-34" x2="16" y2="-34"/>' +
        '<line x1="-16" y1="-19" x2="16" y2="-19"/>' +
      '</g>' +
      '<path d="M -54 -6 Q -54 64 0 64 Q 54 64 54 -6" fill="none" stroke="#fff" stroke-opacity="0.9" stroke-width="6.5" stroke-linecap="round"/>' +
      '<line x1="0" y1="64" x2="0" y2="98" stroke="#fff" stroke-opacity="0.9" stroke-width="6.5" stroke-linecap="round"/>' +
      '<line x1="-28" y1="98" x2="28" y2="98" stroke="#fff" stroke-opacity="0.9" stroke-width="6.5" stroke-linecap="round"/>' +
    '</g>' +
  '</svg>';
  coverCache[index] = svg;
  return svg;
}

/* ================= UI UPDATES ================= */
function updateActiveStars(){
  starEls.forEach(el => el.classList.toggle('active', +el.dataset.index === current));
}
function updateIcons(){
  const playingPath = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
  const pausedPath = '<path d="M8 5v14l11-7z"/>';
  ppIcon.innerHTML = playing ? playingPath : pausedPath;
  miniPlayIcon.innerHTML = playing ? playingPath : pausedPath;
}
function updateProgress(){
  const d = current >= 0 ? EPISODES[current].dur : 0;
  const p = d ? Math.min(1, elapsed / d) : 0;
  progressFill.style.transform = 'scaleX(' + p + ')';
  progressKnob.style.left = (p * 100) + '%';
  pCur.textContent = fmt(elapsed);
  miniFill.style.transform = 'scaleX(' + p + ')';
}
function updateFullUI(){
  if (current < 0) {
    pTitle.textContent = '—';
    pDur.textContent = '0:00';
    cover.innerHTML = '';
    return;
  }
  const ep = EPISODES[current];
  pTitle.textContent = ep.title;
  pDur.textContent = fmt(ep.dur);
  cover.innerHTML = makeCoverSVG(current);
  updateProgress();
  updateIcons();
  updateActiveStars();
}
function updateMiniUI(){
  if (current < 0) { miniPlayer.classList.remove('show'); return; }
  const ep = EPISODES[current];
  miniTitle.textContent = ep.title;
  miniCover.innerHTML = makeCoverSVG(current);
  updateProgress();
  updateIcons();
}
function openOverlay(){
  overlay.classList.add('show');
  miniPlayer.classList.remove('show');
  updateFullUI();
  if (!overlayHintShown) {
    showToast('нажмите снаружи, чтобы свернуть', 3200);
    overlayHintShown = true;
  }
}
function closeOverlay(){
  overlay.classList.remove('show');
  if (current >= 0) {
    updateMiniUI();
    setTimeout(() => miniPlayer.classList.add('show'), 200);
  }
}

function updateRepeatIcon(){
  repeatBtn.classList.toggle('active', repeatMode !== 'off');
  if (repeatMode === 'one') {
    repeatIconPath.setAttribute('d', 'M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z');
  } else {
    repeatIconPath.setAttribute('d', 'M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z');
  }
}
function updateShuffleIcon(){
  shuffleBtn.classList.toggle('active', shuffleOn);
}

/* ================= DRAG ================= */
let dragState = null;
let ghostLabel = null;

function spawnTrail(x, y){
  const dot = document.createElement('div');
  dot.className = 'trailDot';
  dot.style.left = x + 'px';
  dot.style.top = y + 'px';
  document.body.appendChild(dot);
  requestAnimationFrame(() => {
    dot.style.opacity = '0';
    dot.style.transform = 'translate(-50%,-50%) scale(.25)';
  });
  setTimeout(() => dot.remove(), 600);
}

function showGhostLabel(text){
  ghostLabel = document.createElement('div');
  ghostLabel.className = 'ghostLabel';
  ghostLabel.textContent = text;
  document.body.appendChild(ghostLabel);
}
function moveGhostLabel(x, y){
  if (!ghostLabel) return;
  ghostLabel.style.left = x + 'px';
  ghostLabel.style.top = (y + 24) + 'px';
}
function removeGhostLabel(){
  if (ghostLabel) {
    ghostLabel.remove();
    ghostLabel = null;
  }
}

function startDrag(index, starEl, e){
  if (transitioning || dragState || ageGateActive) return;
  e.preventDefault();
  const rect = starEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  const ghost = document.createElement('div');
  ghost.className = 'ghostStar';
  ghost.style.left = cx + 'px';
  ghost.style.top = cy + 'px';
  document.body.appendChild(ghost);

  showGhostLabel(EPISODES[index].title);
  moveGhostLabel(cx, cy);

  starEl.classList.add('dragging');
  dropzone.classList.add('visible');
  miniPlayer.classList.remove('show');

  dragState = {
    index, starEl, ghost,
    startX: e.clientX, startY: e.clientY,
    moved: false,
    pid: e.pointerId,
    lastTrail: 0
  };

  window.addEventListener('pointermove', onDragMove);
  window.addEventListener('pointerup', onDragUp);
  window.addEventListener('pointercancel', onDragUp);
}

function onDragMove(e){
  if (!dragState || e.pointerId !== dragState.pid) return;
  const dx = e.clientX - dragState.startX;
  const dy = e.clientY - dragState.startY;
  if (Math.hypot(dx, dy) > 8) dragState.moved = true;

  dragState.ghost.style.left = e.clientX + 'px';
  dragState.ghost.style.top = e.clientY + 'px';
  moveGhostLabel(e.clientX, e.clientY);

  const now = performance.now();
  if (now - dragState.lastTrail > 26) {
    spawnTrail(e.clientX, e.clientY);
    dragState.lastTrail = now;
  }

  const r = dropzone.getBoundingClientRect();
  const over = e.clientX > r.left && e.clientX < r.right &&
               e.clientY > r.top && e.clientY < r.bottom;
  dropzone.classList.toggle('hover', over);
}

function onDragUp(e){
  if (!dragState || e.pointerId !== dragState.pid) return;
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('pointerup', onDragUp);
  window.removeEventListener('pointercancel', onDragUp);

  const state = dragState;
  dragState = null;
  removeGhostLabel();

  if (!state.moved) {
    transitioning = true;
    const g = state.ghost;
    dropzone.classList.remove('visible');
    g.style.transition = 'left .6s cubic-bezier(.5,0,.2,1), top .6s cubic-bezier(.5,0,.2,1), transform .6s ease, opacity .3s ease';
    g.style.left = '50vw';
    g.style.top = '50vh';
    g.style.transform = 'translate(-50%,-50%) scale(2.2)';
    setTimeout(() => {
      g.style.transform = 'translate(-50%,-50%) scale(0.15)';
      g.style.opacity = '0';
      setTimeout(() => {
        g.remove();
        state.starEl.classList.remove('dragging');
        setCurrentTrack(state.index);
        openOverlay();
        play();
        transitioning = false;
      }, 280);
    }, 600);
    return;
  }

  const r = dropzone.getBoundingClientRect();
  const over = e.clientX > r.left && e.clientX < r.right &&
               e.clientY > r.top && e.clientY < r.bottom;

  if (!over) {
    dropzone.classList.remove('visible', 'hover');
    const rect = state.starEl.getBoundingClientRect();
    const g = state.ghost;
    g.style.transition = 'left .5s cubic-bezier(.4,0,.3,1), top .5s cubic-bezier(.4,0,.3,1), opacity .4s ease, transform .5s ease';
    g.style.left = (rect.left + rect.width / 2) + 'px';
    g.style.top = (rect.top + rect.height / 2) + 'px';
    g.style.transform = 'translate(-50%,-50%) scale(0.3)';
    g.style.opacity = '0';
    setTimeout(() => {
      g.remove();
      state.starEl.classList.remove('dragging');
      if (current >= 0) miniPlayer.classList.add('show');
    }, 520);
    return;
  }

  transitioning = true;
  dropzone.classList.add('hover');
  const g = state.ghost;
  const targetX = r.left + r.width / 2;
  const targetY = r.top + r.height / 2;
  g.style.transition = 'left .48s cubic-bezier(.5,0,.2,1), top .48s cubic-bezier(.5,0,.2,1), transform .48s ease, opacity .3s ease';
  g.style.left = targetX + 'px';
  g.style.top = targetY + 'px';
  g.style.transform = 'translate(-50%,-50%) scale(2.1)';

  setTimeout(() => {
    g.style.transform = 'translate(-50%,-50%) scale(0.15)';
    g.style.opacity = '0';
    dropzone.classList.remove('hover');
    setTimeout(() => {
      g.remove();
      dropzone.classList.remove('visible');
      state.starEl.classList.remove('dragging');
      setCurrentTrack(state.index);
      openOverlay();
      play();
      setTimeout(() => { transitioning = false; }, 200);
    }, 280);
  }, 480);
}

function setCurrentTrack(n){
  current = n;
  elapsed = 0;
  if (shuffleOn) buildShuffleOrder(n);
  updateFullUI();
  updateMiniUI();
}

/* ================= LOAD / NAV ================= */
let currentPage = 0;

function goToPage(n){
  const nn = Math.max(0, Math.min(totalPages - 1, n));
  if (nn === currentPage) return;
  currentPage = nn;
  sky.style.transform = 'translateY(-' + (nn * 100) + 'vh)';
  pageCurrentEl.textContent = nn + 1;
}

function loadEpisode(n){
  pause();
  setCurrentTrack(n);
  const page = Math.floor(n / PER_PAGE);
  if (page !== currentPage) goToPage(page);
  play();
}

/* ================= CONTROLS ================= */
overlay.addEventListener('click', (e) => {
  if (e.target === overlay) closeOverlay();
});

document.getElementById('playPauseBtn').addEventListener('click', () => {
  if (current < 0) return;
  if (playing) pause();
  else {
    if (elapsed >= EPISODES[current].dur) elapsed = 0;
    play();
  }
});

document.getElementById('prevBtn').addEventListener('click', () => {
  if (current < 0) return;
  if (elapsed > 3) {
    elapsed = 0;
    updateProgress();
    return;
  }
  if (shuffleOn) {
    const prev = getPrevIndex();
    if (prev < 0) return;
    loadEpisode(prev);
    return;
  }
  const n = (current - 1 + EPISODES.length) % EPISODES.length;
  loadEpisode(n);
});

document.getElementById('nextBtn').addEventListener('click', () => {
  if (current < 0) return;
  const next = getNextIndex();
  if (next < 0) { pause(); return; }
  loadEpisode(next);
});

repeatBtn.addEventListener('click', () => {
  const modes = ['off', 'all', 'one'];
  const idx = modes.indexOf(repeatMode);
  repeatMode = modes[(idx + 1) % 3];
  updateRepeatIcon();
  const names = { off: 'повтор выключен', all: 'повтор всех', one: 'повтор трека' };
  showToast(names[repeatMode], 1800);
});

shuffleBtn.addEventListener('click', () => {
  shuffleOn = !shuffleOn;
  if (shuffleOn && current >= 0) buildShuffleOrder(current);
  updateShuffleIcon();
  showToast(shuffleOn ? 'случайный порядок' : 'по порядку', 1800);
});

progressBar.addEventListener('click', (e) => {
  if (current < 0) return;
  const rect = progressBar.getBoundingClientRect();
  const p = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  elapsed = p * EPISODES[current].dur;
  updateProgress();
});

miniPlayer.addEventListener('click', (e) => {
  if (e.target.closest('#miniPlayBtn')) return;
  if (current < 0) return;
  openOverlay();
});

miniPlayBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  if (current < 0) return;
  if (playing) pause();
  else {
    if (elapsed >= EPISODES[current].dur) elapsed = 0;
    play();
  }
});

/* ================= KEYBOARD / SCROLL ================= */
document.addEventListener('keydown', (e) => {
  if (ageGateActive) return;
  if (overlay.classList.contains('show')) {
    if (e.key === 'Escape') closeOverlay();
    return;
  }
  if (dragState) return;
  if (e.key === 'ArrowDown' || e.key === 'PageDown') {
    e.preventDefault();
    goToPage(currentPage + 1);
  } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
    e.preventDefault();
    goToPage(currentPage - 1);
  }
});

setInterval(() => {
  if (!playing || current < 0) return;
  const now = performance.now();
  elapsed += (now - lastTick) / 1000;
  lastTick = now;
  if (elapsed >= EPISODES[current].dur) { onTrackEnd(); return; }
  updateProgress();
}, 200);

let wheelAccum = 0;
let wheelTimer = null;

window.addEventListener('wheel', (e) => {
  if (ageGateActive || overlay.classList.contains('show') || dragState) return;
  wheelAccum += e.deltaY;
  clearTimeout(wheelTimer);
  wheelTimer = setTimeout(() => {
    if (Math.abs(wheelAccum) > 28) {
      if (wheelAccum > 0) goToPage(currentPage + 1);
      else goToPage(currentPage - 1);
    }
    wheelAccum = 0;
  }, 70);
}, { passive: true });

let touchY = 0;
let touchActive = false;
window.addEventListener('touchstart', (e) => {
  if (ageGateActive || overlay.classList.contains('show') || dragState) return;
  touchY = e.touches[0].clientY;
  touchActive = true;
}, { passive: true });
window.addEventListener('touchend', (e) => {
  if (!touchActive || dragState) return;
  touchActive = false;
  const dy = touchY - e.changedTouches[0].clientY;
  if (Math.abs(dy) > 55) {
    if (dy > 0) goToPage(currentPage + 1);
    else goToPage(currentPage - 1);
  }
}, { passive: true });

function loop(t){
  drawBg(t);
  requestAnimationFrame(loop);
}

window.addEventListener('resize', resize);
document.addEventListener('pointerdown', () => {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}, { once: true });

resize();
updateActiveStars();
updateIcons();
updateRepeatIcon();
updateShuffleIcon();
requestAnimationFrame(loop);
</script>
